<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eef4fa">
<title>快递决策看板｜2026/07/25费率</title>
<style>
:root{
  --bg:#eef4fa;--panel:#ffffff;--panel-2:#f7fafc;--line:#d8e2ec;
  --text:#1e293b;--muted:#64748b;--blue:#2563eb;--orange:#ea580c;
  --green:#16a34a;--red:#dc2626;--amber:#d97706;--purple:#7c3aed;
  --postal:#2563eb;--yto:#ea580c;--zto:#16a34a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;background:
  radial-gradient(circle at 8% -8%,rgba(59,130,246,.14),transparent 28rem),
  radial-gradient(circle at 95% 5%,rgba(139,92,246,.10),transparent 24rem),var(--bg);
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
button,input,select{font:inherit}
button{color:inherit}
.app{max-width:1440px;margin:0 auto;padding:24px}
.hero{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;
  padding:24px 26px;border:1px solid var(--line);border-radius:20px;
  background:linear-gradient(135deg,#ffffff,#edf5ff);
  box-shadow:0 16px 46px rgba(71,85,105,.10)
}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.14em;margin-bottom:8px}
h1{font-size:clamp(26px,4vw,42px);line-height:1.08;margin:0 0 10px;letter-spacing:-.04em}
.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.meta-chip,.tag{border:1px solid #cbd9e8;background:#f8fbff;color:#475569;border-radius:999px;padding:7px 10px;font-size:12px;white-space:nowrap}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(71,85,105,.06)}
.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.mode-btn{
  min-height:76px;padding:12px 14px;border:1px solid transparent;border-radius:12px;
  background:transparent;text-align:left;cursor:pointer;transition:.2s ease
}
.mode-btn:hover{background:#f1f5f9}
.mode-btn.active{background:linear-gradient(135deg,#e8f1ff,#f2efff);border-color:#9db9e4}
.mode-btn strong{display:block;font-size:14px;margin-bottom:5px}
.mode-btn span{display:block;color:var(--muted);font-size:12px;line-height:1.45}
.weight-box{padding:12px 14px}
.label-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}
.label-row label{font-size:13px;font-weight:800}
.current-weight{color:var(--blue);font-size:12px;font-weight:800}
.weight-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.weight-chip{
  padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#f8fafc;
  color:#475569;font-size:12px;font-weight:700;cursor:pointer
}
.weight-chip:hover,.weight-chip.active{border-color:var(--blue);background:#e8f1ff;color:#1d4ed8}
.weight-input{display:flex;align-items:center;gap:6px;margin-left:auto}
.weight-input input{
  width:92px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
  background:#fff;color:var(--text);outline:none
}
.weight-input input:focus,.search-input:focus,.select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(96,165,250,.12)}
.weight-input button,.primary-btn{
  padding:8px 12px;border:1px solid #3b82f6;border-radius:9px;background:#2563eb;
  color:#fff;font-weight:800;cursor:pointer
}
.notice{
  display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;
  border:1px solid rgba(245,158,11,.3);border-radius:12px;background:rgba(245,158,11,.08);
  color:#92400e;font-size:12px;line-height:1.6
}
.notice strong{white-space:nowrap}
.section{margin-top:18px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:10px}
.section-head h2{font-size:17px;margin:0}
.section-head p{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 8px 22px rgba(71,85,105,.05)}
.kpi-label{color:var(--muted);font-size:12px;margin-bottom:8px}
.kpi-value{font-size:27px;font-weight:900;letter-spacing:-.03em}
.kpi-sub{color:var(--muted);font-size:11px;margin-top:5px}
.postal-text{color:var(--postal)}.yto-text{color:var(--yto)}.zto-text{color:var(--zto)}.amber-text{color:#d97706}
.decision-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.decision-grid.two{grid-template-columns:repeat(2,1fr)}
.decision-card{position:relative;overflow:hidden;padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 8px 22px rgba(71,85,105,.05)}
.decision-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.decision-card.postal{--accent:var(--postal)}.decision-card.yto{--accent:var(--yto)}.decision-card.zto{--accent:var(--zto)}
.decision-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.courier{font-size:16px;font-weight:900}
.warehouse{color:var(--muted);font-size:11px;margin-top:4px}
.count{font-size:24px;font-weight:900;color:var(--accent)}
.province-list{display:flex;gap:6px;flex-wrap:wrap;align-content:flex-start;min-height:58px}
.province-pill{padding:5px 7px;border-radius:6px;background:#f1f5f9;color:#334155;border:1px solid #dbe4ee;font-size:11px}
.province-pill.exception{background:#fff7ed;color:#c2410c;border-color:#fed7aa;font-weight:800}
.empty{color:var(--muted);font-size:12px}
.spotlight{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px}
.lookup{padding:16px}
.lookup h3,.rule-panel h3{font-size:14px;margin:0 0 12px}
.field{margin-bottom:10px}
.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}
.select,.search-input{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;
  background:#fff;color:var(--text);outline:none
}
.spot-result{padding:18px;display:grid;grid-template-columns:minmax(190px,.8fr) minmax(0,1.2fr);gap:20px;align-items:center}
.result-eyebrow{font-size:11px;color:var(--muted);margin-bottom:8px}
.result-route{font-size:23px;font-weight:900;line-height:1.25}
.result-price{font-size:30px;font-weight:900;margin-top:8px}
.reason{color:var(--muted);font-size:12px;line-height:1.6;margin-top:8px}
.price-compare{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.price-compare.two{grid-template-columns:repeat(2,1fr)}
.price-box{padding:12px;border:1px solid var(--line);border-radius:11px;background:#f8fafc}
.price-box.best{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.price-name{font-size:11px;color:var(--muted)}
.price-number{font-size:18px;font-weight:900;margin-top:5px}
.price-note{font-size:10px;color:var(--muted);margin-top:4px;min-height:14px}
.rule-panel{padding:16px}
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rule{padding:11px;border-radius:10px;background:#f8fafc;border:1px solid #dbe4ee}
.rule b{font-size:12px;display:block;margin-bottom:5px}.rule span{font-size:11px;color:var(--muted);line-height:1.5}
.table-panel{overflow:hidden}
.table-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.table-title{font-size:14px;font-weight:900}
.table-title small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:4px}
.search-input{width:230px}
.table-wrap{overflow:auto;max-height:650px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:970px}
thead{position:sticky;top:0;z-index:3;background:#e8f0f8}
th{padding:11px 10px;color:#334155;text-align:left;border-bottom:1px solid #cbd8e6;white-space:nowrap}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:#0f172a}
td{padding:10px;border-bottom:1px solid #e2e8f0;color:#334155;vertical-align:middle}
tbody tr:hover{background:#f4f8fc}
.sub-row td:first-child{padding-left:28px;color:#7c3aed}
.sub-row{background:#faf8ff}
.money{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.recommend{display:inline-flex;align-items:center;gap:6px;font-weight:900}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.policy{display:inline-block;padding:4px 7px;border-radius:6px;border:1px solid var(--line);font-size:10px;white-space:nowrap}
.policy.speed{color:#b45309;border-color:#fcd34d;background:#fffbeb}
.policy.price{color:#15803d;border-color:#86efac;background:#f0fdf4}
.policy.business{color:#7c3aed;border-color:#c4b5fd;background:#faf5ff}
.delta-cost{color:#d97706;font-size:10px;display:block;margin-top:3px}
.footer{display:flex;justify-content:space-between;gap:16px;padding:20px 4px 4px;color:#64748b;font-size:11px}
.login-overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99;
  background:linear-gradient(135deg,#dbeafe 0,#eef2ff 50%,#f5f3ff 100%);
  transition:opacity .25s ease,visibility .25s ease
}
.login-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.login-box{width:min(400px,100%);padding:32px;border:1px solid #cbd8e6;border-radius:20px;background:#fff;box-shadow:0 24px 80px rgba(71,85,105,.18)}
.lock{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:rgba(96,165,250,.12);color:var(--blue);font-size:22px;margin-bottom:18px}
.login-box h2{font-size:22px;margin:0 0 7px}.login-box p{font-size:12px;color:var(--muted);margin:0 0 18px}
.password-row{display:flex;gap:8px}
.password-row input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);outline:none}
.password-row button{padding:0 16px;border:1px solid #3b82f6;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}
.login-error{min-height:18px;color:#f87171;font-size:11px;margin-top:8px}
@media(max-width:1000px){
  .toolbar,.spotlight{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}
  .decision-grid,.decision-grid.two{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero-meta{justify-content:flex-start}
}
@media(max-width:680px){
  .app{padding:12px}.hero{padding:20px}.toolbar{gap:10px}.mode-switch{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}.kpi:last-child{grid-column:1/-1}
  .spot-result{grid-template-columns:1fr}.price-compare,.price-compare.two{grid-template-columns:1fr}
  .rules{grid-template-columns:repeat(2,1fr)}.table-tools{align-items:stretch;flex-direction:column}
  .search-input{width:100%}.weight-input{margin-left:0;width:100%}.weight-input input{flex:1}
  .footer{flex-direction:column}.hero-meta{display:none}
}
</style>
</head>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="lock">🔐</div>
    <h2>快递决策看板</h2>
    <p>输入访问密码后查看全国快递分配与价格明细</p>
    <div class="password-row">
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="请输入密码" aria-label="访问密码">
      <button id="loginButton" type="button">进入</button>
    </div>
    <div class="login-error" id="loginError" aria-live="polite"></div>
  </div>
</div>

<main class="app">

  '内蒙古':[1.35,1.60,7.70,15.35,21.80,26.80],'西藏':null,'新疆':null
};
const ztoProvinceSurcharge = {'上海':1,'海南':1,'北京':'bj'};
const ztoCitySurcharge = {
  '广州':0.5,'深圳':0.5,'阿坝州':'sp','甘孜州':'sp','凉山州':'sp',
  '北戴河区':0.5,'海港区':0.3,'山海关区':0.3,'昌黎县':0.3
};
const specialCities = {
  '广东': [
    {city:'广州', note:'中通+0.50；邮政2天内'},
    {city:'深圳', note:'中通+0.50；邮政3天内'}
  ],
  '四川': [
    {city:'阿坝州', note:'中通特殊计价'},
    {city:'甘孜州', note:'中通特殊计价'},
    {city:'凉山州', note:'中通特殊计价'}
  ],
  '河北': [
    {city:'北戴河区', note:'中通+0.50'},
    {city:'海港区', note:'中通+0.30'},
    {city:'山海关区', note:'中通+0.30'},
    {city:'昌黎县', note:'中通+0.30'}
  ]
};

const state = {
  mode: 1,
  weight: 300,
  lookupProvince: '湖北',
  lookupCity: '',
  tableFilter: '',
  sortKey: 'order',
  sortDirection: 1
};

function getRelevantCities(province){
  const cities = specialCities[province] || [];
  return state.mode === 1 ? cities : cities.filter(item => Boolean(getSla(province, item.city)));
}

function roundMoney(value){
  return value === null || value === undefined ? null : Number(value.toFixed(2));
}

function postalContractPrice(province, weight){
  for(const [, [provinces, prices]] of Object.entries(postalZones)){
    if(!provinces.includes(province)) continue;
    if(weight <= 300) return roundMoney(prices[0]);
    if(weight <= 500) return roundMoney(prices[1]);
    if(weight <= 1000) return roundMoney(prices[2]);
    if(weight <= 2000) return roundMoney(prices[3]);
    if(weight <= 3000) return roundMoney(prices[4]);
    if(weight <= 5000) return roundMoney(prices[5] + (weight / 1000 - 1) * prices[6]);
  }
  return null;
}

function ytoContractPrice(province, weight){
  const rates = ytoRates[province];
  if(!rates) return null;
  let price;
  if(weight <= 1000) price = rates[0];
  else if(weight <= 2000) price = rates[1];
  else if(weight <= 3000) price = rates[2];
  else return null;
  return roundMoney(price);
}

function ztoPrice(province, city, weight){
  const cityRule = ztoCitySurcharge[city] || 0;
  if(province === '西藏' || province === '新疆' || cityRule === 'sp'){
    const billedKg = Math.max(1, Math.ceil(weight / 1000));
    return roundMoney(20.10 + (billedKg - 1) * 18.10);
  }
  const rates = ztoRates[province + '省'] || ztoRates[province];
  if(!rates) return null;
  let price;
  if(weight <= 500) price = rates[0];
  else if(weight <= 1000) price = rates[1];
  else if(weight <= 2000) price = rates[2];
  else if(weight <= 3000) price = rates[3];
  else if(weight <= 4000) price = rates[4];
  else if(weight <= 5000) price = rates[5];
  else price = rates[0] + (weight / 1000 - 1) * rates[5];
  const provinceRule = ztoProvinceSurcharge[province];
  if(typeof provinceRule === 'number') price += provinceRule;
  if(provinceRule === 'bj') price += weight <= 3000 ? 1 : (weight / 1000) * 0.5;
  if(typeof cityRule === 'number') price += cityRule;
  return roundMoney(price);
}

function getPrices(province, city, weight){
  const postalContract = postalContractPrice(province, weight);
  const ytoContract = ytoContractPrice(province, weight);
  return {
    '邮政': postalContract === null ? null : roundMoney(postalContract + XIANGYANG_ADJUSTMENT),
    '圆通': ytoContract === null ? null : roundMoney(ytoContract + XIANGYANG_ADJUSTMENT),
    '中通': ztoPrice(province, city, weight)
  };
}

function getSla(province, city){
  return POSTAL_SLA[province + (city ? '-' + city : '')] || POSTAL_SLA[province] || '';
}

function getPriceLeader(prices, mode){
  const names = mode === 1 ? ['中通','圆通','邮政'] : ['圆通','邮政'];
  const available = names.filter(name => prices[name] !== null);
  if(!available.length) return null;
  return available.reduce((best, name) => prices[name] < prices[best] ? name : best, available[0]);
}

function makeDecision(province, city, weight, mode){
  const prices = getPrices(province, city, weight);
  const priceLeader = getPriceLeader(prices, mode);
  if(!priceLeader) return null;
  let courier = priceLeader;
  let reason = '价格最优';
  let policy = 'price';
  const sla = getSla(province, city);

  if(mode === 1){
    if(sla && prices['邮政'] !== null && prices['邮政'] === prices[priceLeader]){
      courier = '邮政'; reason = '价格并列，按已知邮政时效优先'; policy = 'speed';
    }
  }else{
    if(HB_AROUND.has(province) && prices['邮政'] !== null){
      courier = '邮政'; reason = '湖北及周边省市，邮政时效优先'; policy = 'speed';
    }else if(sla && prices['邮政'] !== null){
      courier = '邮政'; reason = '邮政承诺' + sla + '，时效优先'; policy = 'speed';
    }
  }

  const warehouse = courier === '中通' ? '广西云仓' : '襄阳仓';
  const extraCost = prices[priceLeader] === null ? 0 : roundMoney(prices[courier] - prices[priceLeader]);
  return {province, city, prices, priceLeader, courier, warehouse, reason, policy, sla, extraCost, price:prices[courier]};
}

function getAllRows(){
  const rows = [];
  let order = 0;
  zoneOrder.forEach(group => {
    group.provinces.forEach(province => {
      rows.push({...makeDecision(province, '', state.weight, state.mode), zone:group.zone, order:order++, isCity:false});
      getRelevantCities(province).forEach(item => {
        rows.push({...makeDecision(province, item.city, state.weight, state.mode), zone:group.zone, order:order++, isCity:true, cityNote:item.note});
      });
    });
  });
  return rows.filter(Boolean);
}

function money(value){
  return value === null || value === undefined ? '—' : '¥' + Number(value).toFixed(2);
}

function courierClass(name){
  return name === '邮政' ? 'postal' : name === '圆通' ? 'yto' : 'zto';
}

function policyLabel(item){
  if(item.policy === 'speed') return '<span class="policy speed">时效优先</span>';
  if(item.policy === 'business') return '<span class="policy business">业务规则</span>';
  return '<span class="policy price">价格优先</span>';
}

function weightLabel(weight){
  return weight >= 1000 ? (weight / 1000).toFixed(weight % 1000 === 0 ? 0 : 2) + 'kg' : weight + 'g';
}

function renderNotice(){
  const notice = document.getElementById('modeNotice');
  if(state.mode === 1){
    notice.innerHTML = '<strong>板块一规则</strong><span>不强制指定快递：三家先比较价格；价格相同时，已提供邮政时效的北京、上海、广州、深圳优先邮政。其他地区因未提供完整时效表，按最低价推荐。</span>';
  }else{
    notice.innerHTML = '<strong>板块二规则</strong><span>中通已完全排除。湖北、湖南、江西、安徽、河南、陕西、重庆优先邮政；北京、上海、深圳按邮政3天内，广州按邮政2天内；其他地区按圆通与邮政低价优先。</span>';
  }
}

function renderKpis(provinceRows){
  const counts = {'邮政':0,'圆通':0,'中通':0};
  provinceRows.forEach(row => counts[row.courier]++);
  const speedCount = provinceRows.filter(row => row.policy === 'speed').length;
  const availableCount = provinceRows.length;
  return `
    <section class="section">
      <div class="section-head"><div><h2>当前决策总览</h2><p>${weightLabel(state.weight)} · 统计省级地区，不含特殊城市子项</p></div></div>
      <div class="kpis">
        <div class="kpi"><div class="kpi-label">覆盖地区</div><div class="kpi-value">${availableCount}</div><div class="kpi-sub">省级地区</div></div>
        <div class="kpi"><div class="kpi-label">推荐邮政</div><div class="kpi-value postal-text">${counts['邮政']}</div><div class="kpi-sub">襄阳仓</div></div>
        <div class="kpi"><div class="kpi-label">推荐圆通</div><div class="kpi-value yto-text">${counts['圆通']}</div><div class="kpi-sub">襄阳仓</div></div>
        <div class="kpi"><div class="kpi-label">推荐中通</div><div class="kpi-value zto-text">${state.mode === 1 ? counts['中通'] : '—'}</div><div class="kpi-sub">${state.mode === 1 ? '广西云仓' : '本板块不参与'}</div></div>
        <div class="kpi"><div class="kpi-label">时效优先</div><div class="kpi-value amber-text">${speedCount}</div><div class="kpi-sub">${state.mode === 2 ? '省级地区' : '待补全时效表'}</div></div>
      </div>
    </section>`;
}

function renderDecisionCards(provinceRows, allRows){
  const couriers = state.mode === 1 ? ['中通','圆通','邮政'] : ['圆通','邮政'];
  const provinceCourier = new Map(provinceRows.map(row => [row.province, row.courier]));
  const cityExceptions = allRows.filter(row => row.isCity && row.courier !== provinceCourier.get(row.province));
  const exceptionsByProvince = new Map();
  cityExceptions.forEach(row => {
    const items = exceptionsByProvince.get(row.province) || [];
    items.push(row.city);
    exceptionsByProvince.set(row.province, items);
  });
  const cards = couriers.map(courier => {
    const items = provinceRows.filter(row => row.courier === courier);
    const warehouse = courier === '中通' ? '广西云仓' : '襄阳仓';
    const pills = items.map(item => {
      const exclusions = exceptionsByProvince.get(item.province) || [];
      const label = exclusions.length ? `${item.province}（${exclusions.join('+')}除外）` : item.province;
      return `<span class="province-pill">${label}</span>`;
    });
    cityExceptions
      .filter(row => row.courier === courier)
      .forEach(row => pills.push(`<span class="province-pill exception">${row.city}-${row.province}</span>`));
    return `
      <article class="decision-card ${courierClass(courier)}">
        <div class="decision-top">
          <div><div class="courier">${courier}</div><div class="warehouse">${warehouse}</div></div>
          <div class="count">${items.length}</div>
        </div>
        <div class="province-list">${pills.length ? pills.join('') : '<span class="empty">当前重量无推荐地区</span>'}</div>
      </article>`;
  }).join('');
  const exceptionNote = cityExceptions.length ? '；不同于全省推荐的特殊城市已自动单列' : '';
  return `
    <section class="section">
      <div class="section-head"><div><h2>全国快递分配</h2><p>按当前板块与重量生成；特殊城市规则以明细表为准${exceptionNote}</p></div></div>
      <div class="decision-grid ${couriers.length === 2 ? 'two' : ''}">${cards}</div>
    </section>`;
}

function provinceOptions(){
  return allProvinces.map(p => `<option value="${p}" ${p === state.lookupProvince ? 'selected' : ''}>${p}</option>`).join('');
}

function cityOptions(province){
  const options = getRelevantCities(province);
  return '<option value="">全省默认</option>' + options.map(item => `<option value="${item.city}" ${item.city === state.lookupCity ? 'selected' : ''}>${item.city}</option>`).join('');
}

function renderSpotResult(){
  const box = document.getElementById('spotResult');
  if(!box) return;
  const decision = makeDecision(state.lookupProvince, state.lookupCity, state.weight, state.mode);
  if(!decision){
    box.innerHTML = '<div class="empty">当前条件无可用快递。</div>';
    return;
  }
  const names = state.mode === 1 ? ['邮政','圆通','中通'] : ['邮政','圆通'];
  const compare = names.map(name => {
    const isBest = decision.priceLeader === name;
    const className = courierClass(name);
    let note = isBest ? '价格最优' : '';
    if(name === '邮政' && decision.sla) note = decision.sla;
    if(name === '中通' && (decision.city === '广州' || decision.city === '深圳')) note = '含城市+0.50';
    return `
      <div class="price-box ${isBest ? 'best' : ''}" style="--accent:var(--${className})">
        <div class="price-name">${name}</div>
        <div class="price-number ${className}-text">${money(decision.prices[name])}</div>
        <div class="price-note">${note || ' '}</div>
      </div>`;
  }).join('');
  const extra = decision.extraCost > 0 ? `<span class="delta-cost">比最低价增加 ${money(decision.extraCost)}</span>` : '';
  box.innerHTML = `
    <div>
      <div class="result-eyebrow">${decision.province}${decision.city ? ' · ' + decision.city : ''}｜${weightLabel(state.weight)}</div>
      <div class="result-route">${decision.warehouse} → <span class="${courierClass(decision.courier)}-text">${decision.courier}</span></div>
      <div class="result-price">${money(decision.price)}</div>
      <div class="reason">${policyLabel(decision)}　${decision.reason}${extra}</div>
    </div>
    <div class="price-compare ${names.length === 2 ? 'two' : ''}">${compare}</div>`;
}

function renderSpotlight(){
  const cityDisabled = !getRelevantCities(state.lookupProvince).length;
  return `
    <section class="section">
      <div class="section-head"><div><h2>单地区快速决策</h2><p>选省份、特殊城市，立即查看仓库、快递与费用</p></div></div>
      <div class="spotlight">
        <div class="panel lookup">
          <h3>查询条件</h3>
          <div class="field"><label for="provinceSelect">省份</label><select class="select" id="provinceSelect">${provinceOptions()}</select></div>
          <div class="field"><label for="citySelect">特殊城市 / 地区</label><select class="select" id="citySelect" ${cityDisabled ? 'disabled' : ''}>${cityOptions(state.lookupProvince)}</select></div>
        </div>
        <div class="panel spot-result" id="spotResult"></div>
      </div>
    </section>`;
}

function renderRules(){
  const rules = state.mode === 1 ? [
    ['三网参与','广西云仓中通、襄阳仓圆通、邮政'],
    ['默认条件','不强制指定快递，三家可用时优先选择最低价'],
    ['价格并列','北京、上海、广州、深圳按已知邮政时效优先'],
    ['本地仓成本','圆通、邮政均在表价基础上加0.30元'],
    ['中通备注加价','上海/海南+1元；北京3kg内+1元；广州/深圳+0.50元'],
    ['圆通适用范围','图片未列新疆、西藏，两个地区按圆通不可用处理'],
    ['时效口径','其他地区未提供完整三网时效表，按价格推荐']
  ] : [
    ['仅两网参与','襄阳仓圆通、邮政；中通不参与'],
    ['本地仓成本','圆通、邮政均在表价基础上加0.30元'],
    ['圆通适用范围','图片未列新疆、西藏，两个地区按圆通不可用处理'],
    ['周边邮政优先','湖北、湖南、江西、安徽、河南、陕西、重庆'],
    ['明确时效','北京/上海/深圳3天内；广州2天内'],
    ['其他地区','圆通与邮政按当前价格低者推荐']
  ];
  return `
    <section class="section panel rule-panel">
      <h3>当前决策规则</h3>
      <div class="rules">${rules.map(item => `<div class="rule"><b>${item[0]}</b><span>${item[1]}</span></div>`).join('')}</div>
    </section>`;
}

function sortRows(rows){
  const key = state.sortKey;
  const direction = state.sortDirection;
  return [...rows].sort((a,b) => {
    let av, bv;
    if(key === 'region'){av = a.province + a.city;bv = b.province + b.city}
    else if(key === 'postal'){av = a.prices['邮政'] ?? Infinity;bv = b.prices['邮政'] ?? Infinity}
    else if(key === 'yto'){av = a.prices['圆通'] ?? Infinity;bv = b.prices['圆通'] ?? Infinity}
    else if(key === 'zto'){av = a.prices['中通'] ?? Infinity;bv = b.prices['中通'] ?? Infinity}
    else if(key === 'recommend'){av = a.courier;bv = b.courier}
    else if(key === 'price'){av = a.price ?? Infinity;bv = b.price ?? Infinity}
    else {av = a.order;bv = b.order}
    if(typeof av === 'number' && typeof bv === 'number') return (av - bv) * direction;
    return String(av).localeCompare(String(bv),'zh-CN') * direction;
  });
}

function renderTableBody(){
  const tbody = document.getElementById('decisionTableBody');
  if(!tbody) return;
  let rows = getAllRows();
  const keyword = state.tableFilter.trim().toLowerCase();
  if(keyword){
    rows = rows.filter(row => (row.province + row.city + row.zone + row.courier + row.warehouse + row.reason).toLowerCase().includes(keyword));
  }
  rows = sortRows(rows);
  tbody.innerHTML = rows.map(row => {
    const extra = row.extraCost > 0 ? `<span class="delta-cost">时效/规则成本 +${money(row.extraCost)}</span>` : '';
    const timeText = row.sla ? '邮政' + row.sla : (HB_AROUND.has(row.province) && state.mode === 2 ? '周边邮政优先' : '—');
    return `
      <tr class="${row.isCity ? 'sub-row' : ''}">
        <td>${row.isCity ? '↳ ' + row.city : row.province}<div class="muted" style="font-size:10px;margin-top:3px">${row.isCity ? row.province + ' · ' + (row.cityNote || '') : row.zone}</div></td>
        <td><strong>${row.priceLeader}</strong></td>
        <td class="money postal-text">${money(row.prices['邮政'])}</td>
        <td class="money yto-text">${money(row.prices['圆通'])}</td>
        ${state.mode === 1 ? `<td class="money zto-text">${money(row.prices['中通'])}</td>` : ''}
        <td>${timeText}</td>
        <td>${policyLabel(row)}</td>
        <td><span class="recommend ${courierClass(row.courier)}-text"><span class="dot"></span>${row.courier}</span>${extra}</td>
        <td>${row.warehouse}</td>
        <td class="money"><strong>${money(row.price)}</strong></td>
      </tr>`;
  }).join('') || '<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--muted)">没有匹配地区</td></tr>';
}

function sortMark(key){
  return state.sortKey === key ? (state.sortDirection === 1 ? ' ↑' : ' ↓') : '';
}

function renderTable(){
  const ztoHeader = state.mode === 1 ? `<th data-sort="zto">中通${sortMark('zto')}</th>` : '';
  return `
    <section class="section panel table-panel">
      <div class="table-tools">
        <div class="table-title">全国比价与决策明细<small>点击表头排序；金额单位：元</small></div>
        <input class="search-input" id="tableSearch" value="${state.tableFilter}" placeholder="搜索省份、城市、快递或仓库" aria-label="搜索明细">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th data-sort="region">地区${sortMark('region')}</th>
            <th>价格最优</th>
            <th data-sort="postal" style="text-align:right">邮政${sortMark('postal')}</th>
            <th data-sort="yto" style="text-align:right">圆通${sortMark('yto')}</th>
            ${ztoHeader}
            <th>已知时效</th>
            <th>决策口径</th>
            <th data-sort="recommend">最终推荐${sortMark('recommend')}</th>
            <th>发货仓</th>
            <th data-sort="price" style="text-align:right">执行价${sortMark('price')}</th>
          </tr></thead>
          <tbody id="decisionTableBody"></tbody>
        </table>
      </div>
    </section>`;
}

function attachDynamicEvents(){
  const provinceSelect = document.getElementById('provinceSelect');
  const citySelect = document.getElementById('citySelect');
  provinceSelect.addEventListener('change', event => {
    state.lookupProvince = event.target.value;
    state.lookupCity = '';
    citySelect.innerHTML = cityOptions(state.lookupProvince);
    citySelect.disabled = !getRelevantCities(state.lookupProvince).length;
    renderSpotResult();
  });
  citySelect.addEventListener('change', event => {
    state.lookupCity = event.target.value;
    renderSpotResult();
  });
  document.getElementById('tableSearch').addEventListener('input', event => {
    state.tableFilter = event.target.value;
    renderTableBody();
  });
  document.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if(state.sortKey === key) state.sortDirection *= -1;
      else {state.sortKey = key;state.sortDirection = 1}
      renderDashboard();
    });
  });
}

function renderDashboard(){
  const allRows = getAllRows();
  const provinceRows = allRows.filter(row => !row.isCity);
  document.getElementById('currentWeightLabel').textContent = weightLabel(state.weight);
  renderNotice();
  document.getElementById('dashboard').innerHTML =
    renderKpis(provinceRows) +
    renderDecisionCards(provinceRows, allRows) +
    renderSpotlight() +
    renderRules() +
    renderTable();
  attachDynamicEvents();
  renderSpotResult();
  renderTableBody();
}

document.getElementById('modeSwitch').addEventListener('click', event => {
  const button = event.target.closest('[data-mode]');
  if(!button) return;
  state.mode = Number(button.dataset.mode);
  if(!getRelevantCities(state.lookupProvince).some(item => item.city === state.lookupCity)){
    state.lookupCity = '';
  }
  document.querySelectorAll('.mode-btn').forEach(item => item.classList.toggle('active', item === button));
  state.sortKey = 'order';
  state.sortDirection = 1;
  renderDashboard();
});

document.getElementById('weightControls').addEventListener('click', event => {
  const button = event.target.closest('[data-weight]');
  if(!button) return;
  state.weight = Number(button.dataset.weight);
  document.querySelectorAll('.weight-chip').forEach(item => item.classList.toggle('active', item === button));
  document.getElementById('customWeight').value = '';
  renderDashboard();
});

function applyCustomWeight(){
  const input = document.getElementById('customWeight');
  const value = Number(input.value);
  if(!Number.isFinite(value) || value < 1 || value > 5000){
    input.setCustomValidity('请输入 1–5000 克');
    input.reportValidity();
    return;
  }
  input.setCustomValidity('');
  state.weight = Math.round(value);
  document.querySelectorAll('.weight-chip').forEach(item => item.classList.remove('active'));
  renderDashboard();
}
document.getElementById('applyWeight').addEventListener('click', applyCustomWeight);
document.getElementById('customWeight').addEventListener('keydown', event => {
  if(event.key === 'Enter') applyCustomWeight();
});

function unlock(){
  const input = document.getElementById('passwordInput');
  if(input.value === ACCESS_PASSWORD){
    sessionStorage.setItem('expressDashboardUnlocked','1');
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('loginError').textContent = '';
  }else{
    document.getElementById('loginError').textContent = '密码错误，请重新输入';
    input.select();
  }
}
document.getElementById('loginButton').addEventListener('click', unlock);
document.getElementById('passwordInput').addEventListener('keydown', event => {
  if(event.key === 'Enter') unlock();
});
if(sessionStorage.getItem('expressDashboardUnlocked') === '1'){
  document.getElementById('loginOverlay').classList.add('hidden');
}else{
  window.addEventListener('load', () => document.getElementById('passwordInput').focus());
}

renderDashboard();
</script>
</body>
</html>
