<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>快递决策看板</title>
<style>
:root{--green:#48bb78;--blue:#667eea;--orange:#DD8452;--red:#e53e3e;--bg:#f5f7fa;--card:#fff;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:#2d3748;min-height:100vh}
.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px 24px;text-align:center}
.header h1{font-size:22px;margin-bottom:4px}
.header p{font-size:12px;opacity:.85}
.container{max-width:1200px;margin:0 auto;padding:16px}
.weight-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.wbtn{padding:10px 20px;border:2px solid #e2e8f0;border-radius:10px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;color:#4a5568}
.wbtn:hover{border-color:var(--blue);color:var(--blue)}
.wbtn.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 12px rgba(102,126,234,.3)}
.matrix{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.row{background:var(--card);border-radius:10px;padding:12px 16px;box-shadow:0 2px 6px rgba(0,0,0,.06);border-left:4px solid #ddd}
.row.gx{border-left-color:var(--green);background:#f0fff4}
.row.yto{border-left-color:var(--orange);background:#fffaf0}
.row.post{border-left-color:var(--blue);background:#eff6ff}
.row-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;color:#fff}
.badge-gx{background:var(--green)}
.badge-yto{background:var(--orange)}
.badge-post{background:var(--blue)}
.courier-tag{font-size:12px;color:#718096}
.row-body{font-size:13px;line-height:1.8;color:#2d3748}
.row-body .exc{color:var(--red);font-weight:600}
.not-send{font-size:12px;color:var(--red);margin-top:4px}
.login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
.login-overlay.hidden{opacity:0;pointer-events:none}
.login-box{background:#fff;border-radius:16px;padding:40px 32px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:360px;width:90%}
.login-box h2{font-size:20px;color:#2d3748;margin-bottom:6px}
.login-box p{font-size:13px;color:#718096;margin-bottom:20px}
.login-box input{width:100%;padding:12px 16px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;text-align:center;outline:none;transition:border-color .2s;letter-spacing:4px}
.login-box input:focus{border-color:#667eea}
.login-box .err{color:#e53e3e;font-size:12px;margin-top:8px;min-height:18px}
.login-box button{width:100%;padding:12px;margin-top:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .2s}
.login-box button:hover{opacity:.9}
.footer{text-align:center;font-size:11px;color:#a0aec0;padding:12px}
</style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
<div class="login-box">
<h2>🔐 快递决策看板</h2><p>请输入访问密码</p>
<input type="password" id="pwdInput" placeholder="请输入密码" onkeydown="if(event.key==='Enter')checkPwd()">
<div class="err" id="pwdErr"></div>
<button onclick="checkPwd()">验证进入</button>
</div></div>
<div class="header">
<h1>📦 快递决策看板 2026.7.25</h1>
<p>🏭 襄阳仓(圆通/邮政) | 🏭 广西云仓(中通) | 红字=排除/特殊处理</p>
</div>
<div class="container">
<div class="weight-bar" id="weight-bar"></div>
<div id="result-area"><div style="text-align:center;color:#a0aec0;padding:40px;font-size:14px">请点击重量段查看决策</div></div>
<div class="footer">数据2026.7.25 | 业务规则：海南/广州/深圳强制走圆通</div>
</div>
<script>
function checkPwd(){
const p=document.getElementById('pwdInput').value;
if(p==='mq520520'){document.getElementById('loginOverlay').classList.add('hidden');}
else{document.getElementById('pwdErr').textContent='密码错误，请重试';}
}
const postalZones={
    '一区':[['湖北'],[1.40,1.60,1.75,2.50,3.20,4.00,1.50]],
    '二区1':[['湖南','江西','安徽','河南'],[1.40,1.60,1.75,2.50,3.20,4.00,1.50]],
    '二区2':[['广东','陕西','山东','浙江','河北','山西','江苏','福建','重庆','上海'],[1.40,1.65,1.80,2.60,3.20,4.00,1.50]],
    '三区1':[['贵州','天津','广西','四川','甘肃','宁夏'],[1.50,1.75,1.90,2.90,4.00,4.00,1.50]],
    '三区2':[['云南','北京','内蒙古','海南'],[2.00,2.60,3.10,3.60,4.60,4.00,1.50]],
    '三区3':[['辽宁'],[2.00,2.60,3.10,3.60,5.00,4.00,1.50]],
    '四区':[['吉林','黑龙江'],[2.10,2.60,3.10,3.60,5.00,5.00,2.00]],
    '五区':[['新疆','西藏','青海'],[12.00,12.00,16.00,28.00,40.00,16.00,12.00]],
};
const allProvs=[];for(const z in postalZones)allProvs.push(...postalZones[z][0]);
const ytoP={};
['北京','天津','河北','山西','内蒙古','辽宁','吉林','黑龙江','上海','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','广西','海南','重庆','四川','贵州','云南','陕西','甘肃','青海','宁夏'].forEach(p=>ytoP[p]=1.95);
ytoP['北京']=2.75;ytoP['上海']=2.75;ytoP['海南']=2.0;ytoP['重庆']=2.0;ytoP['四川']=2.0;ytoP['贵州']=2.0;ytoP['云南']=2.0;ytoP['甘肃']=2.0;ytoP['青海']=2.0;ytoP['宁夏']=2.0;ytoP['内蒙古']=2.0;ytoP['辽宁']=2.0;ytoP['吉林']=2.0;ytoP['黑龙江']=2.0;
const ztoR={
    '江苏省':[1.35,1.60,2.65,3.10,9.80,11.80],'浙江省':[1.35,1.60,2.65,3.10,9.80,11.80],
    '安徽省':[1.35,1.60,2.65,3.10,9.80,11.80],'江西省':[1.35,1.60,2.65,3.10,9.80,11.80],
    '福建省':[1.35,1.60,2.65,3.10,9.80,11.80],'海南省':[1.35,1.60,2.65,3.10,9.80,11.80],
    '广东省':[1.35,1.60,2.65,3.10,9.80,11.80],'广西省':[1.35,1.60,2.65,3.10,9.80,11.80],
    '湖北省':[1.35,1.60,2.65,3.10,9.80,11.80],'湖南省':[1.35,1.60,2.65,3.10,9.80,11.80],
    '河南省':[1.35,1.60,2.65,3.10,9.80,11.80],'上海':[1.35,1.60,2.65,3.10,9.80,11.80],
    '北京':[1.35,1.60,2.65,3.10,9.80,11.80],'四川省':[1.35,1.60,2.65,3.55,9.80,11.80],
    '重庆':[1.35,1.60,2.65,3.55,9.80,11.80],'贵州省':[1.35,1.60,2.65,3.55,9.80,11.80],
    '云南省':[1.35,1.60,2.65,3.55,9.80,11.80],'山东省':[1.35,1.60,2.65,3.55,9.80,11.80],
    '河北省':[1.35,1.60,2.65,3.55,9.80,11.80],'天津':[1.35,1.60,2.65,3.55,9.80,11.80],
    '山西省':[1.35,1.60,2.65,3.55,9.80,11.80],'陕西省':[1.35,1.60,2.65,3.55,9.80,11.80],
    '辽宁省':[1.35,1.60,6.70,15.35,14.30,17.30],'吉林省':[1.35,1.60,6.70,15.35,17.30,21.30],
    '黑龙江省':[1.35,1.60,6.70,15.35,19.30,23.80],'宁夏':[1.35,1.60,7.70,15.35,21.80,26.80],
    '甘肃省':[1.35,1.60,7.70,15.35,21.80,26.80],'青海省':[1.35,1.60,7.70,15.35,21.80,26.80],
    '内蒙古':[1.35,1.60,7.70,15.35,21.80,26.80],'西藏':null,'新疆':null
};
const ztoSc={'上海':1,'海南':1,'北京':'bj'};
const citySc={'广州':0.5,'深圳':0.5,'阿坝州':'sp','甘孜州':'sp','凉山州':'sp','北戴河区':0.5,'海港区':0.3,'山海关区':0.3,'昌黎县':0.3};

function postalP(prov,w){for(const z in postalZones){const arr=postalZones[z];if(arr[0].includes(prov)){const p=arr[1];if(w<=300)return+(p[0]+0.3).toFixed(2);if(w<=500)return+(p[1]+0.3).toFixed(2);if(w<=1000)return+(p[2]+0.3).toFixed(2);if(w<=2000)return+(p[3]+0.3).toFixed(2);if(w<=3000)return+(p[4]+0.3).toFixed(2);if(w<=5000){const kg=w/1000;return+(p[5]+(kg-1)*p[6]+0.3).toFixed(2);}}}return null;}
function ytoP2(prov,w){const b=ytoP[prov];if(!b)return null;if(w<=1000)return+(b+0.3).toFixed(2);if(w<=2000)return+(b+0.5).toFixed(2);if(w<=3200)return+(b+0.7).toFixed(2);return null;}
function ztoP(prov,city,w){const key=prov+'省';const arr=ztoR[key]||ztoR[prov];if(!arr)return null;if(prov==='西藏'||prov==='新疆'){const kg=w/1000;return+(20.1+Math.max(0,kg-1)*18.1).toFixed(2);}const cs=citySc[city]||0;if(cs==='sp'){const kg=w/1000;return+(20.1+Math.max(0,kg-1)*18.1).toFixed(2);}let price;if(w<=500)price=arr[0];else if(w<=1000)price=arr[1];else if(w<=2000)price=arr[2];else if(w<=3000)price=arr[3];else if(w<=4000)price=arr[4];else if(w<=5000)price=arr[5];else price=arr[0]+(w/1000-1)*arr[5];const sc=ztoSc[prov];if(typeof sc==='number')price+=sc;else if(sc==='bj')price+=w<=3000?1:(w/1000)*0.5;if(typeof cs==='number')price+=cs;return+price.toFixed(2);}

const weights=[300,500,1000,2000,3000,3500];
const wLabels=['0-300g','300-500g','500-1kg','1-2kg','2-3kg','3kg以上'];
const bar=document.getElementById('weight-bar');
wLabels.forEach((l,i)=>{const btn=document.createElement('button');btn.className='wbtn';btn.textContent=l;btn.onclick=()=>{document.querySelectorAll('.wbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');showMatrix(weights[i]);};bar.appendChild(btn);});
bar.children[0].classList.add('active');

function showMatrix(w){
    const gxList=[],ytoList=[],postList=[];
    
    for(const prov of allProvs){
        const pv=postalP(prov,w),yv=ytoP2(prov,w),zv=ztoP(prov,'',w);
        const cand=[];
        if(pv)cand.push({n:'邮政',p:pv});if(yv)cand.push({n:'圆通',p:yv});if(zv)cand.push({n:'中通',p:zv});
        if(!cand.length)continue;
        const best=cand.reduce((a,b)=>a.p<b.p?a:b);
        
        // 业务规则覆盖：海南/广州/深圳强制圆通
        if(prov==='海南'){
            ytoList.push('海南'); continue;
        }
        if(prov==='广东'){
            gxList.push('广东');  // 广东基础走中通
            // 检查广州/深圳是否应该走圆通
            const zvGZ=ztoP('广东','广州',w),yvGZ=ytoP2('广东',w);
            const candGZ=[];
            if(yvGZ)candGZ.push({n:'圆通',p:yvGZ});
            if(zvGZ)candGZ.push({n:'中通',p:zvGZ});
            // 广州/深圳强制圆通（业务规则）
            // 这些在圆通行中显示
            continue;
        }
        
        if(best.n==='中通')gxList.push(prov);
        else if(best.n==='圆通')ytoList.push(prov);
        else if(best.n==='邮政')postList.push(prov);
    }
    
    // 圆通强制加入海海、广东-广州、广东-深圳
    if(!ytoList.includes('海南')){
        // 海南应该已经在ytoList或已在别处
    }
    // 加入广东特殊城市到圆通
    ytoList.push('广东-广州(圆通)','广东-深圳(圆通)');
    
    const notGx=allProvs.filter(p=>!gxList.includes(p));
    const notPost=allProvs.filter(p=>!postList.includes(p));
    
    let html='<div class="matrix">';
    
    // 中通显示（排除标注）
    const excProvinces={'广东':['广州','深圳'],'四川':['阿坝州','甘孜州','凉山州'],'河北':['北戴河区']};
    const allExcCities=[]; for(const[p,cs]of Object.entries(excProvinces)){for(const c of cs)allExcCities.push(p+'-'+c);}
    
    if(gxList.length){
        html+=`<div class="row gx"><div class="row-header"><span class="badge badge-gx">广西云仓</span><span class="courier-tag">📦 中通</span></div>`;
        html+=`<div class="row-body">`;
        let items=[];
        for(const p of gxList){
            if(excProvinces[p])items.push(`<span class="exc">${p}(排除${excProvinces[p].join('、')})</span>`);
            else items.push(p);
        }
        html+=items.join('、');
        html+=`</div>`;
        const notGxP=allProvs.filter(p=>!gxList.includes(p));
        const allNot=[...notGxP,...allExcCities];
        html+=`<div class="not-send">少数不发：${allNot.join('、')}</div>`;
        html+=`</div>`;
    }
    
    // 圆通（海南/广州/深圳标红）
    if(ytoList.length){
        html+=`<div class="row yto"><div class="row-header"><span class="badge badge-yto">襄阳仓</span><span class="courier-tag">📦 圆通</span></div>`;
        html+=`<div class="row-body">`;
        let items=[];
        for(const p of ytoList){
            if(p==='海南'||p==='广东-广州'||p==='广东-深圳')items.push('<span class="exc">'+p+'</span>');
            else items.push(p);
        }
        html+=items.join('、');
        html+=`</div>`;
        html+=`</div>`;
    }
    
    // 邮政
    if(postList.length){
        html+=`<div class="row post"><div class="row-header"><span class="badge badge-post">襄阳仓</span><span class="courier-tag">📦 邮政</span></div>`;
        html+=`<div class="row-body">${postList.join('、')}</div>`;
        if(notPost.length&&notPost.length<8)html+=`<div class="not-send">少数不发：${notPost.join('、')}</div>`;
        html+=`</div>`;
    }
    
    html+='</div>';
    
    // 详细比价表
    html+=`<div style="background:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 2px 6px rgba(0,0,0,.06);margin-bottom:16px"><div style="font-weight:600;margin-bottom:8px">📊 各省三网比价明细</div>`;
    html+=`<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:#f7fafc">`;
    html+=`<th style="padding:6px 4px;text-align:left;border-bottom:1px solid #e2e8f0">省份</th>`;
    html+=`<th style="padding:6px 4px;text-align:center;border-bottom:1px solid #e2e8f0;color:#4C72B0">邮政</th>`;
    html+=`<th style="padding:6px 4px;text-align:center;border-bottom:1px solid #e2e8f0;color:#DD8452">圆通</th>`;
    html+=`<th style="padding:6px 4px;text-align:center;border-bottom:1px solid #e2e8f0;color:#55A868">中通</th>`;
    html+=`<th style="padding:6px 4px;text-align:center;border-bottom:1px solid #e2e8f0">推荐</th>`;
    html+=`<th style="padding:6px 4px;text-align:center;border-bottom:1px solid #e2e8f0">仓库</th></tr></thead><tbody>`;
    
    for(const prov of allProvs){
        const pv=postalP(prov,w),yv=ytoP2(prov,w),zv=ztoP(prov,'',w);
        const cand=[];
        if(pv)cand.push({n:'邮政',p:pv});if(yv)cand.push({n:'圆通',p:yv});if(zv)cand.push({n:'中通',p:zv});
        let best='-',wh='-',minP=null;
        if(cand.length){
            const mc=cand.reduce((a,b)=>a.p<b.p?a:b);
            best=mc.n;minP=mc.p;
            // 业务规则
            if(prov==='海南'){best='圆通';wh='襄阳仓';}
            else if(prov==='广东'){
                best='中通';wh='广西云仓';
            }else if(best==='中通'){wh='广西云仓';}
            else if(best==='圆通'){wh='襄阳仓';}
            else if(best==='邮政'){wh='襄阳仓';}
        }
        
        let rowColor='';
        if(wh==='广西云仓')rowColor='background:#f0fff4';
        else if(wh==='襄阳仓'&&best==='圆通')rowColor='background:#fffaf0';
        else if(wh==='襄阳仓'&&best==='邮政')rowColor='background:#eff6ff';
        
        html+=`<tr style="${rowColor}">`;
        html+=`<td style="padding:4px;border-bottom:1px solid #f0f0f0;font-weight:600">${prov}</td>`;
        html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0">${pv?'¥'+pv.toFixed(2):'-'}</td>`;
        html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0">${yv?'¥'+yv.toFixed(2):'-'}</td>`;
        html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0">${zv?'¥'+zv.toFixed(2):'-'}</td>`;
        html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-weight:700;color:#006100">${best}</td>`;
        html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px">${wh}</td></tr>`;
        
        // 广东特殊城市
        if(prov==='广东'){
            for(const city of['广州','深圳']){
                const zvc=ztoP('广东',city,w),yvc=ytoP2('广东',w),pv2=postalP('广东',w);
                html+=`<tr style="background:#fffaf0"><td style="padding:4px;border-bottom:1px solid #f0f0f0;color:#e53e3e;font-size:11px">└ ${prov}-${city}</td>`;
                html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px">¥${pv2?pv2.toFixed(2):'-'}</td>`;
                html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px">¥${yvc?yvc.toFixed(2):'-'}</td>`;
                html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px">¥${zvc?zvc.toFixed(2):'-'}(+0.5)</td>`;
                html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px;color:#e53e3e;font-weight:700">圆通</td>`;
                html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px;color:#e53e3e">襄阳仓</td></tr>`;
            }
        }
        // 四川特殊城市
        if(prov==='四川'){
            for(const city of['阿坝州','甘孜州','凉山州']){
                const zvc=ztoP('四川',city,w),yvc=ytoP2('四川',w),pv2=postalP('四川',w);
                const cBest='邮政';
                html+=`<tr style="background:#eff6ff"><td style="padding:4px;border-bottom:1px solid #f0f0f0;color:#e53e3e;font-size:11px">└ ${prov}-${city}</td>`;
                html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px">¥${pv2?pv2.toFixed(2):'-'}</td>`;
                html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px">¥${yvc?yvc.toFixed(2):'-'}</td>`;
                html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px">¥${zvc?zvc.toFixed(2):'-'}(特殊计价)</td>`;
                html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px;color:#e53e3e;font-weight:700">${cBest}</td>`;
                html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px;color:#e53e3e">襄阳仓</td></tr>`;
            }
        }
        // 河北特殊城市
        if(prov==='河北'){
            const city='北戴河区',zvc=ztoP('河北',city,w),yvc=ytoP2('河北',w),pv2=postalP('河北',w);
            const zvc2=ztoP('河北','',w),pv3=postalP('河北',w);
            const zBest=zvc<=pv3?'中通':(yvc<=pv3?'圆通':'邮政');
            html+=`<tr style="background:#eff6ff"><td style="padding:4px;border-bottom:1px solid #f0f0f0;color:#e53e3e;font-size:11px">└ ${prov}-${city}</td>`;
            html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px">¥${pv2?pv2.toFixed(2):'-'}</td>`;
            html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px">¥${yvc?yvc.toFixed(2):'-'}</td>`;
            html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px">¥${zvc?zvc.toFixed(2):'-'}(+0.5)</td>`;
            html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px;color:#e53e3e;font-weight:700">${zBest}</td>`;
            html+=`<td style="padding:4px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:11px;color:#e53e3e">襄阳仓</td></tr>`;
        }
    }
    html+=`</tbody></table></div>`;
    
    document.getElementById('result-area').innerHTML=html;
}
showMatrix(weights[0]);
</script>
