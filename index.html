<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>快递决策看板</title>
<style>
:root{--green:#48bb78;--blue:#667eea;--orange:#DD8452;--red:#e53e3e;--bg:#f5f7fa;--card:#fff;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:#2d3748;min-height:100vh}
.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px 24px;text-align:center}
.header h1{font-size:22px;margin-bottom:4px}
.header p{font-size:12px;opacity:.85}
.container{max-width:1200px;margin:0 auto;padding:16px}
.weight-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.wbtn{padding:10px 20px;border:2px solid #e2e8f0;border-radius:10px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;color:#4a5568}
.wbtn:hover{border-color:var(--blue);color:var(--blue)}
.wbtn.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 12px rgba(102,126,234,.3)}
.mode-bar{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.mbtn{padding:8px 16px;border:2px solid #e2e8f0;border-radius:8px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;color:#4a5568}
.mbtn:hover{border-color:#764ba2;color:#764ba2}
.mbtn.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:#764ba2}
.matrix{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.row{background:var(--card);border-radius:10px;padding:12px 16px;box-shadow:0 2px 6px rgba(0,0,0,.06);border-left:4px solid #ddd}
.row.gx{border-left-color:var(--green);background:#f0fff4}
.row.yto{border-left-color:var(--orange);background:#fffaf0}
.row.post{border-left-color:var(--blue);background:#eff6ff}
.row-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;color:#fff}
.badge-gx{background:var(--green)}
.badge-yto{background:var(--orange)}
.badge-post{background:var(--blue)}
.courier-tag{font-size:12px;color:#718096}
.row-body{font-size:13px;line-height:1.8;color:#2d3748}
.row-body .exc{color:var(--red);font-weight:600}
.not-send{font-size:12px;color:var(--red);margin-top:4px}
.login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
.login-overlay.hidden{opacity:0;pointer-events:none}
.login-box{background:#fff;border-radius:16px;padding:40px 32px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:360px;width:90%}
.login-box h2{font-size:20px;color:#2d3748;margin-bottom:6px}
.login-box p{font-size:13px;color:#718096;margin-bottom:20px}
.login-box input{width:100%;padding:12px 16px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;text-align:center;outline:none;transition:border-color .2s;letter-spacing:4px}
.login-box input:focus{border-color:#667eea}
.login-box .err{color:#e53e3e;font-size:12px;margin-top:8px;min-height:18px}
.login-box button{width:100%;padding:12px;margin-top:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .2s}
.login-box button:hover{opacity:.9}
.footer{text-align:center;font-size:11px;color:#a0aec0;padding:12px}
</style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
<div class="login-box">
<h2>🔐 快递决策看板</h2><p>请输入访问密码</p>
<input type="password" id="pwdInput" placeholder="请输入密码" onkeydown="if(event.key==='Enter')checkPwd()">
<div class="err" id="pwdErr"></div>
<button onclick="checkPwd()">验证进入</button>
</div></div>
<div class="header">
<h1>📦 快递决策看板 2026.7.25</h1>
<p>🏭 襄阳仓(圆通/邮政) | 🏭 广西云仓(中通) | 两板块切换查看</p>
</div>
<div class="container">
<div class="weight-bar" id="weight-bar"></div>
<div class="mode-bar" id="mode-bar">
<button class="mbtn active" data-mode="1">板块一 · 三网比价</button>
<button class="mbtn" data-mode="2">板块二 · 圆通vs邮政</button>
</div>
<div id="result-area"><div style="text-align:center;color:#a0aec0;padding:40px;font-size:14px">请点击重量段查看决策</div></div>
<div class="footer">数据2026.7.25 | 襄阳仓+0.3元 | 板块二：湖北周边邮政时效优先</div>
</div>
<script>
function checkPwd(){
const p=document.getElementById('pwdInput').value;
if(p==='mq520520'){document.getElementById('loginOverlay').classList.add('hidden');}
else{document.getElementById('pwdErr').textContent='密码错误，请重试';}
}
// ========== 数据 ==========
const postalZones={
'一区':[['湖北'],[1.40,1.60,1.75,2.50,3.20,4.00,1.50]],
'二区1':[['湖南','江西','安徽','河南'],[1.40,1.60,1.75,2.50,3.20,4.00,1.50]],
'二区2':[['广东','陕西','山东','浙江','河北','山西','江苏','福建','重庆','上海'],[1.40,1.65,1.80,2.60,3.20,4.00,1.50]],
'三区1':[['贵州','天津','广西','四川','甘肃','宁夏'],[1.50,1.75,1.90,2.90,4.00,4.00,1.50]],
'三区2':[['云南','北京','内蒙古','海南'],[2.00,2.60,3.10,3.60,4.60,4.00,1.50]],
'三区3':[['辽宁'],[2.00,2.60,3.10,3.60,5.00,4.00,1.50]],
'四区':[['吉林','黑龙江'],[2.10,2.60,3.10,3.60,5.00,5.00,2.00]],
'五区':[['新疆','西藏','青海'],[12.00,12.00,16.00,28.00,40.00,16.00,12.00]],
};
const allProvs=[];for(const z in postalZones)allProvs.push(...postalZones[z][0]);
const ytoP={};
['北京','天津','河北','山西','内蒙古','辽宁','吉林','黑龙江','上海','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','广西','海南','重庆','四川','贵州','云南','陕西','甘肃','青海','宁夏'].forEach(p=>ytoP[p]=1.95);
ytoP['北京']=2.75;ytoP['上海']=2.75;ytoP['海南']=2.0;ytoP['重庆']=2.0;ytoP['四川']=2.0;ytoP['贵州']=2.0;ytoP['云南']=2.0;ytoP['甘肃']=2.0;ytoP['青海']=2.0;ytoP['宁夏']=2.0;ytoP['内蒙古']=2.0;ytoP['辽宁']=2.0;ytoP['吉林']=2.0;ytoP['黑龙江']=2.0;
const ztoR={
'江苏省':[1.35,1.60,2.65,3.10,9.80,11.80],'浙江省':[1.35,1.60,2.65,3.10,9.80,11.80],'安徽省':[1.35,1.60,2.65,3.10,9.80,11.80],'江西省':[1.35,1.60,2.65,3.10,9.80,11.80],'福建省':[1.35,1.60,2.65,3.10,9.80,11.80],'海南省':[1.35,1.60,2.65,3.10,9.80,11.80],'广东省':[1.35,1.60,2.65,3.10,9.80,11.80],'广西省':[1.35,1.60,2.65,3.10,9.80,11.80],'湖北省':[1.35,1.60,2.65,3.10,9.80,11.80],'湖南省':[1.35,1.60,2.65,3.10,9.80,11.80],'河南省':[1.35,1.60,2.65,3.10,9.80,11.80],'上海':[1.35,1.60,2.65,3.10,9.80,11.80],'北京':[1.35,1.60,2.65,3.10,9.80,11.80],'四川省':[1.35,1.60,2.65,3.55,9.80,11.80],'重庆':[1.35,1.60,2.65,3.55,9.80,11.80],'贵州省':[1.35,1.60,2.65,3.55,9.80,11.80],'云南省':[1.35,1.60,2.65,3.55,9.80,11.80],'山东省':[1.35,1.60,2.65,3.55,9.80,11.80],'河北省':[1.35,1.60,2.65,3.55,9.80,11.80],'天津':[1.35,1.60,2.65,3.55,9.80,11.80],'山西省':[1.35,1.60,2.65,3.55,9.80,11.80],'陕西省':[1.35,1.60,2.65,3.55,9.80,11.80],'辽宁省':[1.35,1.60,6.70,15.35,14.30,17.30],'吉林省':[1.35,1.60,6.70,15.35,17.30,21.30],'黑龙江省':[1.35,1.60,6.70,15.35,19.30,23.80],'宁夏':[1.35,1.60,7.70,15.35,21.80,26.80],'甘肃省':[1.35,1.60,7.70,15.35,21.80,26.80],'青海省':[1.35,1.60,7.70,15.35,21.80,26.80],'内蒙古':[1.35,1.60,7.70,15.35,21.80,26.80],'西藏':null,'新疆':null};
const ztoSc={'上海':1,'海南':1,'北京':'bj'};
const citySc={'广州':0.5,'深圳':0.5,'阿坝州':'sp','甘孜州':'sp','凉山州':'sp','北戴河区':0.5,'海港区':0.3,'山海关区':0.3,'昌黎县':0.3};
const HB_AROUND=new Set(['湖北','湖南','江西','安徽','河南','陕西','重庆']);

function postalP(prov,w){for(const z in postalZones){const arr=postalZones[z];if(arr[0].includes(prov)){const p=arr[1];if(w<=300)return+(p[0]+0.3).toFixed(2);if(w<=500)return+(p[1]+0.3).toFixed(2);if(w<=1000)return+(p[2]+0.3).toFixed(2);if(w<=2000)return+(p[3]+0.3).toFixed(2);if(w<=3000)return+(p[4]+0.3).toFixed(2);if(w<=5000){const kg=w/1000;return+(p[5]+(kg-1)*p[6]+0.3).toFixed(2);}}}return null;}
function ytoP2(prov,w){const b=ytoP[prov];if(!b)return null;if(w<=1000)return+(b+0.3).toFixed(2);if(w<=2000)return+(b+0.5).toFixed(2);if(w<=3200)return+(b+0.7).toFixed(2);return null;}
function ztoP(prov,city,w){const key=prov+'省';const arr=ztoR[key]||ztoR[prov];if(!arr)return null;if(prov==='西藏'||prov==='新疆'){const kg=w/1000;return+(20.1+Math.max(0,kg-1)*18.1).toFixed(2);}const cs=citySc[city]||0;if(cs==='sp'){const kg=w/1000;return+(20.1+Math.max(0,kg-1)*18.1).toFixed(2);}let price;if(w<=500)price=arr[0];else if(w<=1000)price=arr[1];else if(w<=2000)price=arr[2];else if(w<=3000)price=arr[3];else if(w<=4000)price=arr[4];else if(w<=5000)price=arr[5];else price=arr[0]+(w/1000-1)*arr[5];const sc=ztoSc[prov];if(typeof sc==='number')price+=sc;else if(sc==='bj')price+=w<=3000?1:(w/1000)*0.5;if(typeof cs==='number')price+=cs;return+price.toFixed(2);}

const weights=[300,500,1000,2000,3000,3500];
const wLabels=['0-300g','300-500g','500-1kg','1-2kg','2-3kg','3kg以上'];
let currentMode=1,currentWeight=weights[0];

// Init
const bar=document.getElementById('weight-bar');
wLabels.forEach((l,i)=>{const b=document.createElement('button');b.className='wbtn';b.textContent=l;b.onclick=()=>{document.querySelectorAll('.wbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentWeight=weights[i];showMatrix();};bar.appendChild(b);});
bar.children[0].classList.add('active');
document.getElementById('mode-bar').addEventListener('click',e=>{if(e.target.classList.contains('mbtn')){document.querySelectorAll('.mbtn').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');currentMode=parseInt(e.target.dataset.mode);showMatrix();}});

// ====== 决策核心 ======
function decide(prov,city,w,mode){
const S=0.3,pv=postalP(prov,w),yv=ytoP2(prov,w),zv=ztoP(prov,city||'',w);
const pvS=pv?+(pv+S).toFixed(2):null,yvS=yv?+(yv+S).toFixed(2):null;
const cand=[];if(pvS)cand.push({n:'邮政',p:pvS});if(yvS)cand.push({n:'圆通',p:yvS});if(zv)cand.push({n:'中通',p:zv});
if(!cand.length)return null;
const minP=Math.min(...cand.map(x=>x.p));
const ztoBest=zv&&zv==minP;
if(ztoBest) return {wh:'广西云仓',cour:'中通',price:zv,reason:'中通最优',wc:'#38a169',bg:'#f0fff4'};
// 襄阳仓
if(mode===2){
    // 板块二：湖北周边邮政时效优先
    if(HB_AROUND.has(prov)) return {wh:'襄阳仓',cour:'邮政',price:pvS,reason:'湖北周边·邮政时效优先',wc:'#4C72B0',bg:'#f0f4ff'};
    // 非周边：圆通vs邮政便宜者
    if(!yvS) return {wh:'襄阳仓',cour:'邮政',price:pvS,reason:'圆通不支持',wc:'#4C72B0',bg:'#f0f4ff'};
    if(!pvS) return {wh:'襄阳仓',cour:'圆通',price:yvS,reason:'邮政不支持',wc:'#DD8452',bg:'#fff8f0'};
    if(yvS<=pvS) return {wh:'襄阳仓',cour:'圆通',price:yvS,reason:'价格更低',wc:'#DD8452',bg:'#fff8f0'};
    return {wh:'襄阳仓',cour:'邮政',price:pvS,reason:'价格更低',wc:'#4C72B0',bg:'#f0f4ff'};
}else{
    // 板块一：圆通vs邮政便宜者 + 业务规则
    if(prov==='海南') return {wh:'襄阳仓',cour:'圆通',price:yvS,reason:'业务规则',wc:'#DD8452',bg:'#fff8f0'};
    // 板块一：广州/深圳强制圆通
    if(city==='广州'||city==='深圳'){if(!yvS) return {wh:'襄阳仓',cour:'邮政',price:pvS,reason:'圆通不支持',wc:'#4C72B0',bg:'#f0f4ff'};return {wh:'襄阳仓',cour:'圆通',price:yvS,reason:'城市业务规则',wc:'#DD8452',bg:'#fff8f0'};}
    if(!yvS) return {wh:'襄阳仓',cour:'邮政',price:pvS,reason:'圆通不支持',wc:'#4C72B0',bg:'#f0f4ff'};
    if(!pvS) return {wh:'襄阳仓',cour:'圆通',price:yvS,reason:'邮政不支持',wc:'#DD8452',bg:'#fff8f0'};
    if(yvS<=pvS) return {wh:'襄阳仓',cour:'圆通',price:yvS,reason:'更便宜',wc:'#DD8452',bg:'#fff8f0'};
    return {wh:'襄阳仓',cour:'邮政',price:pvS,reason:'更便宜',wc:'#4C72B0',bg:'#f0f4ff'};
}
}

// ====== 渲染 ======
function showMatrix(){
const w=currentWeight,mode=currentMode;
const gx=[],yto=[],post=[];
for(const p of allProvs){const d=decide(p,'',w,mode);if(!d)continue;if(d.wh==='广西云仓')gx.push(p);else if(d.cour==='圆通')yto.push(p);else post.push(p);}
const excProvinces={'广东':['广州','深圳'],'四川':['阿坝州','甘孜州','凉山州'],'河北':['北戴河区']};
const allExc=[];for(const[p,cs]of Object.entries(excProvinces))for(const c of cs)allExc.push(p+'-'+c);

let html=`<div style="font-size:12px;color:#718096;text-align:center;margin-bottom:12px">${mode===1?'三网比价：中通最优→广西云仓，否则襄阳仓选优':'圆通vs邮政直比：中通最优→广西云仓，否则襄阳仓内选优 | 湖北周边邮政时效优先'}</div>`;
html+='<div class="matrix">';
if(gx.length){html+=`<div class="row gx"><div class="row-header"><span class="badge badge-gx">广西云仓</span><span class="courier-tag">📦 中通</span></div><div class="row-body">`;let items=[];for(const p of gx){if(excProvinces[p])items.push(`<span class="exc">${p}(排除${excProvinces[p].join('、')})</span>`);else items.push(p);}html+=items.join('、')+'</div>';const ng=allProvs.filter(p=>!gx.includes(p));html+=`<div class="not-send">少数不发：${[...ng,...allExc].join('、')}</div></div>`;}
if(yto.length){html+=`<div class="row yto"><div class="row-header"><span class="badge badge-yto">襄阳仓</span><span class="courier-tag">📦 圆通</span></div><div class="row-body">${yto.join('、')}</div>`;const ny=allProvs.filter(p=>!yto.includes(p));if(ny.length<10)html+=`<div class="not-send">少数不发：${ny.join('、')}</div>`;html+=`</div>`;}
if(post.length){html+=`<div class="row post"><div class="row-header"><span class="badge badge-post">襄阳仓</span><span class="courier-tag">📦 邮政</span></div><div class="row-body">${post.join('、')}</div>`;const np=allProvs.filter(p=>!post.includes(p));if(np.length<10)html+=`<div class="not-send">少数不发：${np.join('、')}</div>`;html+=`</div>`;}
html+='</div>';

// 明细表
const S=0.3,zones=[['一区',['湖北']],['二区1',['湖南','江西','安徽','河南']],['二区2',['广东','陕西','山东','浙江','河北','山西','江苏','福建','重庆','上海']],['三区1',['贵州','天津','广西','四川','甘肃','宁夏']],['三区2',['云南','北京','内蒙古','海南']],['三区3',['辽宁']],['四区',['吉林','黑龙江']],['五区',['新疆','西藏','青海']]];
html+=`<div style="background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 2px 6px rgba(0,0,0,.06);margin-bottom:16px"><div style="font-weight:700;font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between"><span>📊 各省比价明细 · ${mode===1?'三网比价':'圆通vs邮政'}</span><span style="font-size:11px;font-weight:400;color:#a0aec0">含襄阳仓+0.3${mode===2?' · 湖北周边邮政时效优先':''}</span></div>`;
html+=`<table style="width:100%;border-collapse:collapse;font-size:12.5px"><thead><tr style="background:#f7fafc"><th style="padding:7px 6px;text-align:left;border-bottom:2px solid #e2e8f0;width:27%">省份</th><th style="padding:7px 4px;text-align:center;border-bottom:2px solid #e2e8f0;width:12%;color:#4C72B0">邮政</th><th style="padding:7px 4px;text-align:center;border-bottom:2px solid #e2e8f0;width:12%;color:#DD8452">圆通</th><th style="padding:7px 4px;text-align:center;border-bottom:2px solid #e2e8f0;width:12%;color:#55A868">中通</th><th style="padding:7px 4px;text-align:center;border-bottom:2px solid #e2e8f0;width:15%">推荐</th><th style="padding:7px 6px;text-align:center;border-bottom:2px solid #e2e8f0;width:22%">仓库 → 到仓价</th></tr></thead><tbody>`;

for(const [zn,zp] of zones){
html+=`<tr><td colspan="6" style="padding:5px 8px;background:#f8fafc;font-size:11px;color:#718096;font-weight:600;border-bottom:1px solid #e2e8f0;letter-spacing:1px">${zn}</td></tr>`;
for(const prov of zp){
const d=decide(prov,'',w,mode);if(!d){html+=`<tr><td style="padding:5px 6px;font-weight:600">${prov}</td><td colspan="5" style="text-align:center;color:#cbd5e0">无可用</td></tr>`;continue;}
const pv=postalP(prov,w),yv=ytoP2(prov,w),zv=ztoP(prov,'',w);
const pvS=pv?+(pv+S).toFixed(2):null,yvS=yv?+(yv+S).toFixed(2):null;
const wl=d.wh==='广西云仓'?d.wh:`${d.wh} <span style="font-size:10px;color:#a0aec0">+0.3</span>`;
const tag=mode===2&&HB_AROUND.has(prov)?' <span style="font-size:10px;color:#4C72B0">●</span>':'';
html+=`<tr style="${d.bg}"><td style="padding:5px 6px;border-bottom:1px solid #edf2f7;font-weight:600">${prov}${tag}</td>`;
html+=`<td style="padding:5px 4px;text-align:center;border-bottom:1px solid #edf2f7;${d.cour==='邮政'?'font-weight:700;':''}color:${d.cour==='邮政'?'#4C72B0':'#718096'}">${pvS?'¥'+pvS:'-'}</td>`;
html+=`<td style="padding:5px 4px;text-align:center;border-bottom:1px solid #edf2f7;${d.cour==='圆通'?'font-weight:700;':''}color:${d.cour==='圆通'?'#DD8452':'#718096'}">${yvS?'¥'+yvS:'-'}</td>`;
html+=`<td style="padding:5px 4px;text-align:center;border-bottom:1px solid #edf2f7;${d.cour==='中通'?'font-weight:700;':''}color:${d.cour==='中通'?'#38a169':'#cbd5e0'}">${zv?'¥'+zv.toFixed(2):'-'}</td>`;
html+=`<td style="padding:5px 4px;text-align:center;border-bottom:1px solid #edf2f7;font-weight:700;color:${d.wc}">${d.cour}</td>`;
html+=`<td style="padding:5px 6px;text-align:center;border-bottom:1px solid #edf2f7;font-size:12px">${wl}<br><span style="font-weight:700;color:${d.wc}">¥${d.price}</span></td></tr>`;

// 特殊城市
function renderCity(prov,city,label){
    const cd=decide(prov,city,w,mode);if(!cd)return;
    const zvc=ztoP(prov,city,w),yvc=ytoP2(prov,w),pv2=postalP(prov,w);
    const pv2S=pv2?+(pv2+S).toFixed(2):null,yv2S=yvc?+(yvc+S).toFixed(2):null;
    const wl2=cd.wh==='广西云仓'?cd.wh:`襄阳仓 <span style="font-size:9px;color:#a0aec0">+0.3</span>`;
    html+=`<tr style="background:${cd.bg}"><td style="padding:3px 6px 3px 20px;border-bottom:1px solid #e0e4f0;font-size:11px;color:#4C51bf"><span style="color:#e53e3e">•</span> ${city} <span style="color:#a0aec0;font-size:10px">${label}</span></td>`;
    html+=`<td style="padding:3px 4px;text-align:center;border-bottom:1px solid #e0e4f0;font-size:11px;font-weight:${cd.cour==='邮政'?'700':'400'};color:${cd.cour==='邮政'?'#4C72B0':'#cbd5e0'}">${pv2S?'¥'+pv2S:'-'}</td>`;
    html+=`<td style="padding:3px 4px;text-align:center;border-bottom:1px solid #e0e4f0;font-size:11px;font-weight:${cd.cour==='圆通'?'700':'400'};color:${cd.cour==='圆通'?'#DD8452':'#cbd5e0'}">${yv2S?'¥'+yv2S:'-'}</td>`;
    html+=`<td style="padding:3px 4px;text-align:center;border-bottom:1px solid #e0e4f0;font-size:11px;text-decoration:${cd.cour==='中通'?'none':'line-through'};color:${cd.cour==='中通'?'#2d3748':'#cbd5e0'}">¥${zvc?zvc.toFixed(2):'-'}</td>`;
    html+=`<td style="padding:3px 4px;text-align:center;border-bottom:1px solid #e0e4f0;font-size:11px;font-weight:700;color:${cd.wc}">${cd.cour}</td>`;
    html+=`<td style="padding:3px 6px;text-align:center;border-bottom:1px solid #e0e4f0;font-size:11px">${wl2}<br><span style="font-weight:700;color:${cd.wc}">¥${cd.price}</span></td></tr>`;
}
if(prov==='广东'){renderCity('广东','广州','中通+0.5');renderCity('广东','深圳','中通+0.5');}
if(prov==='四川'){renderCity('四川','阿坝州','中通特殊计价');renderCity('四川','甘孜州','中通特殊计价');renderCity('四川','凉山州','中通特殊计价');}
if(prov==='河北'){renderCity('河北','北戴河区','中通+0.5');}
}}
html+=`</tbody></table></div>`;
document.getElementById('result-area').innerHTML=html;
}
showMatrix();
