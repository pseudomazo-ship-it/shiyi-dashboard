<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>数据日报</title><style>
/* ══════════ 设计令牌 ══════════ */
:root{
  --bg:#f4f6f9; --surface:#fff; --surface2:#fafbfc;
  --line:#e7eaf0; --line2:#d5dae3;
  --ink:#12151b; --ink2:#5a6474; --ink3:#98a1b0;
  --brand:#2563eb; --brand2:#3b82f6; --brand-l:#eef4ff; --brand-d:#1d4ed8;
  --good:#0ea472; --good-l:#e9f8f3;
  --warn:#e08600; --warn-l:#fff7e8;
  --bad:#e5484d; --bad-l:#fdeeee;
  --violet:#7c5cf0; --violet-l:#f2effe;
  --cyan:#0891b2; --cyan-l:#e6f7fb;
  --sh1:0 1px 2px rgba(18,21,27,.04);
  --sh2:0 2px 4px rgba(18,21,27,.05), 0 12px 28px -18px rgba(18,21,27,.16);
  --sh3:0 4px 10px rgba(18,21,27,.06), 0 20px 40px -24px rgba(18,21,27,.22);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:17px;line-height:1.6;padding:24px 18px 60px;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.wrap{max-width:1240px;margin:0 auto}

/* ══════════ 头部 ══════════ */
header{padding-bottom:2px}
h1{font-size:30px;font-weight:800;letter-spacing:-.7px;color:var(--ink);display:flex;
   align-items:center;gap:11px;flex-wrap:wrap}
h1 .dot{width:11px;height:11px;border-radius:50%;background:var(--good);flex:none;
   box-shadow:0 0 0 4px rgba(14,164,114,.14);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(14,164,114,.14)}50%{box-shadow:0 0 0 7px rgba(14,164,114,.06)}}
.sub{color:var(--ink3);font-size:14.5px;margin-top:9px;font-weight:500}

/* ══════════ 时间段分段控件 ══════════ */
.tabs{display:inline-flex;gap:3px;margin:22px 0 4px;padding:4px;background:var(--surface);
  border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh1)}
.tab{padding:9px 22px;border-radius:10px;color:var(--ink2);font-size:15px;font-weight:700;
  cursor:pointer;transition:all .18s cubic-bezier(.4,0,.2,1);white-space:nowrap;letter-spacing:.2px}
.tab:hover{background:var(--surface2);color:var(--ink)}
.tab.on{background:var(--brand);color:#fff;box-shadow:0 3px 10px -2px rgba(37,99,235,.42)}

/* ══════════ 指标卡（滚动冻结）══════════ */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:13px;margin-top:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 17px 15px;box-shadow:var(--sh1);position:relative;overflow:hidden;
  transition:box-shadow .22s ease,transform .22s ease;min-height:126px;display:flex;
  flex-direction:column;justify-content:space-between}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);opacity:.85}
.kpi.k-good::before{background:var(--good)}
.kpi.k-warn::before{background:var(--warn)}
.kpi.k-bad::before{background:var(--bad)}
.kpi.k-violet::before{background:var(--violet)}
.kpi.k-cyan::before{background:var(--cyan)}
.kpi:hover{box-shadow:var(--sh2)}
.kpi .k{font-size:13.5px;color:var(--ink3);font-weight:700;letter-spacing:.3px;
  display:flex;align-items:center;gap:6px}
.kpi .v{font-size:32px;font-weight:800;color:var(--ink);letter-spacing:-1.5px;line-height:1.08;
  margin-top:9px}
.kpi .v small{font-size:17px;font-weight:700;color:var(--ink2);margin-left:2px;letter-spacing:-.3px}
.kpi .d{font-size:13.5px;margin-top:8px;font-weight:700;display:flex;align-items:center;gap:5px}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--ink3)}
.kpi .spark{margin-top:9px;height:26px;width:100%}

/* ══════════ 区块 ══════════ */
section{margin-top:26px}
h2{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:13px;display:flex;
  align-items:center;gap:9px;flex-wrap:wrap;letter-spacing:-.25px}
h2::before{content:'';width:3px;height:17px;border-radius:2px;background:var(--brand);flex:none}
h2 .cnt{font-weight:600;color:var(--ink3);font-size:13.5px}
h2.foldable{cursor:pointer;-webkit-user-select:none;user-select:none;padding:6px 2px;
  border-radius:10px;transition:opacity .15s ease}
h2.foldable:hover{opacity:.72}
.foldArrow{font-size:11px;color:var(--ink2);transition:transform .25s cubic-bezier(.4,0,.2,1);
  flex:none;margin-left:auto;width:26px;height:26px;line-height:25px;text-align:center;
  border-radius:8px;background:var(--surface);border:1px solid var(--line)}
h2.foldable.closed .foldArrow{transform:rotate(-90deg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 18px;box-shadow:var(--sh2)}

/* ══════════ 仪表盘 + 环形图并排 ══════════ */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.duo .card{padding:18px 16px}
.gtitle{font-size:14.5px;font-weight:800;color:var(--ink2);margin-bottom:6px;display:flex;
  align-items:center;justify-content:space-between}
.gtitle .tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;
  background:var(--brand-l);color:var(--brand)}
.gtitle .tag.good{background:var(--good-l);color:var(--good)}
.gtitle .tag.bad{background:var(--bad-l);color:var(--bad)}
.gwrap{display:flex;align-items:center;justify-content:center;padding:4px 0 2px}

/* ══════════ 折线图 ══════════ */
.linewrap{width:100%;overflow-x:auto;padding:4px 0 2px}
.linewrap svg{display:block}
.linelegend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink2);
  margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-weight:600}
.linelegend span{display:flex;align-items:center;gap:6px}
.linelegend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ══════════ 各店铺业绩（店名独占一行 + 进度条）══════════ */
.srow{padding:14px 0;border-bottom:1px solid var(--line)}
.srow:first-child{padding-top:2px}
.srow:last-child{border-bottom:none;padding-bottom:2px}
.srow .sname{font-size:15.5px;font-weight:800;color:var(--ink);margin-bottom:9px;
  line-height:1.3;display:flex;align-items:center;gap:5px}
.srow .sname .idx{display:inline-block;min-width:23px;height:23px;line-height:23px;text-align:center;
  background:var(--brand-l);color:var(--brand);border-radius:7px;font-size:12px;font-weight:800;flex:none}
/* 同周期涨跌标签 */
.srow .sname .schg{margin-left:auto;font-size:13px;font-weight:800;padding:2px 8px;border-radius:7px;
  flex:none;letter-spacing:.2px;white-space:nowrap}
.schg.up{background:var(--good-l);color:var(--good)}
.schg.down{background:var(--bad-l);color:var(--bad)}
.schg.flat{background:var(--surface2);color:var(--ink3);font-weight:700}
.srow.top .sname .idx{background:var(--good-l);color:var(--good)}
.srow .sline{display:flex;align-items:center;gap:11px}
.srow .sbar{flex:1;min-width:0;height:22px;background:var(--surface2);border-radius:7px;
  overflow:hidden;border:1px solid var(--line)}
.srow .sbar i{display:block;height:100%;border-radius:6px;
  background:linear-gradient(90deg,#7facf7,#2563eb);transition:width .5s cubic-bezier(.2,.8,.3,1)}
.srow.top .sbar i{background:linear-gradient(90deg,#4fd1a5,#0ea472)}
.srow .sval{font-size:15.5px;font-weight:800;color:var(--ink);flex:none;letter-spacing:-.3px}
.srow .srate{font-size:14px;font-weight:800;flex:none;min-width:52px;text-align:right}

/* ══════════ 表格 ══════════ */
.tw{overflow:visible}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px}
thead th{text-align:left;padding:12px 10px;color:var(--ink2);font-size:12.5px;font-weight:800;
  letter-spacing:.4px;background:var(--surface2);border-bottom:1px solid var(--line);
  white-space:nowrap;position:sticky;top:0;z-index:20}
thead th:first-child{border-radius:10px 0 0 0}
thead th:last-child{border-radius:0 10px 0 0}
tbody td{padding:13px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s ease}
tbody tr:hover{background:var(--surface2)}
td.sh{font-weight:700;color:var(--ink)}
td.n{text-align:right}
.pill{display:inline-block;padding:3px 9px;border-radius:7px;font-size:13px;font-weight:800}
.pill.g{background:var(--good-l);color:var(--good)}
.pill.y{background:var(--warn-l);color:var(--warn)}
.pill.r{background:var(--bad-l);color:var(--bad)}

/* ══════════ 数据提示 ══════════ */
.nblk{padding:16px 0;border-bottom:1px solid var(--line)}
.nblk:last-child{border-bottom:none;padding-bottom:2px}
.nblk:first-child{padding-top:2px}
.nblk h3{font-size:15.5px;font-weight:800;color:var(--ink);margin-bottom:11px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nblk h3 .n{font-size:12.5px;font-weight:800;padding:2px 9px;border-radius:6px;
  background:var(--surface2);color:var(--ink2)}
.nblk h3 .n.r{background:var(--bad-l);color:var(--bad)}
.nblk h3 .n.y{background:var(--warn-l);color:var(--warn)}
.nblk h3 .n.g{background:var(--good-l);color:var(--good)}
.ni{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;
  background:var(--surface2);border:1px solid var(--line);margin-bottom:8px;font-size:15px;
  font-weight:600;flex-wrap:wrap}
.ni:last-child{margin-bottom:0}
.ni .nm{font-weight:800;color:var(--ink);min-width:74px}
.ni .dt{color:var(--ink2)}
.ni .bad{color:var(--bad);font-weight:800}
.ni .warn{color:var(--warn);font-weight:800}
.ni.ok{background:var(--good-l);border-color:#cfeee2;color:var(--good)}
.nsum{font-size:15.5px;line-height:1.9;color:var(--ink2)}
.nsum b{color:var(--ink)}
.nsum .hi{color:var(--brand);font-weight:800}

footer{color:var(--ink3);font-size:13.5px;margin-top:40px;text-align:center;line-height:1.9;
  padding-top:20px;border-top:1px solid var(--line)}

/* ══════════ 密码门 ══════════ */
#gate{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:24px}
.gatebox{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);
  border-radius:20px;padding:34px 26px;box-shadow:var(--sh3);text-align:center}
.gatebox .gl{width:50px;height:50px;margin:0 auto 16px;border-radius:15px;background:var(--brand-l);
  display:flex;align-items:center;justify-content:center;font-size:23px}
.gatebox h1{font-size:20px;margin-bottom:7px;justify-content:center;letter-spacing:-.3px}
.gatebox p{color:var(--ink3);font-size:14.5px;margin-bottom:20px}
#pw{width:100%;padding:13px 15px;font-size:17px;border:1px solid var(--line2);border-radius:11px;
  outline:none;transition:.16s;font-family:inherit;text-align:center;letter-spacing:5px;background:var(--surface2)}
#pw:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l);background:#fff}
#pwb{width:100%;margin-top:12px;padding:13px;font-size:16.5px;font-weight:800;color:#fff;
  background:var(--brand);border:none;border-radius:11px;cursor:pointer;font-family:inherit;transition:.16s}
#pwb:hover{background:var(--brand-d)}
#pwb:active{transform:scale(.985)}
#pwerr{color:var(--bad);font-size:14px;margin-top:11px;font-weight:700;min-height:20px}

/* ══════════ 响应式 ══════════ */
@media(max-width:1240px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:820px){
  .duo{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:480px){
  body{font-size:16px;padding:16px 12px 48px}
  h1{font-size:24px}
  .tabs{width:100%;display:flex}
  .tab{flex:1;padding:10px 4px;font-size:14.5px;text-align:center}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .kpi{min-height:104px;padding:13px 12px 12px;border-radius:13px}
  .kpi .k{font-size:12px}
  .kpi .v{font-size:25px;letter-spacing:-1px}
  .kpi .v small{font-size:14px}
  .kpi .d{font-size:12.5px}
  .kpi .spark{height:22px}
  .card{padding:15px 13px;border-radius:14px}
  table{font-size:14px}
  thead th,tbody td{padding:10px 7px}
  h2{font-size:16.5px}
}
</style></head><body>
<div id="gate">
  <div class="gatebox">
    <div class="gl">🔒</div>
    <h1>数据日报</h1>
    <p>请输入访问密码</p>
    <input type="password" id="pw" inputmode="numeric" autocomplete="off" placeholder="····">
    <button id="pwb">进 入</button>
    <div id="pwerr"></div>
  </div>
</div>
<div class="wrap" id="app" style="display:none">

<header>
  <h1><span class="dot"></span>数据日报</h1>
  <div class="sub" id="sub">加载中…</div>
  <div class="tabs" id="tabs">
    <div class="tab" data-w="1">当日</div>
    <div class="tab" data-w="3">近 3 天</div>
    <div class="tab on" data-w="7">近 7 天</div>
    <div class="tab" data-w="m">当月</div>
  </div>
</header>

<div class="kpis" id="kpis"></div>

<section>
  <h2 class="foldable" id="coreHead" data-target="coreBody">
    核心指标 <span class="cnt" id="coreTips"></span>
    <span class="foldArrow">▼</span>
  </h2>
  <div class="duo" id="coreBody">
    <div class="card">
      <div class="gtitle">数值水位 <span class="tag" id="gaugeTag">标准线 46%</span></div>
      <div class="gwrap" id="gauge"></div>
    </div>
    <div class="card">
      <div class="gtitle">业绩构成 <span class="tag" id="donutTag"></span></div>
      <div class="gwrap" id="donut"></div>
    </div>
  </div>
</section>

<section id="trendSec" style="display:none">
  <h2 class="foldable" id="trendHead" data-target="trendBody">
    总业绩趋势 <span class="cnt" id="trendTips"></span>
    <span class="foldArrow">▼</span>
  </h2>
  <div class="card" id="trendBody">
    <div class="linewrap" id="linechart"></div>
    <div class="linelegend" id="linelegend"></div>
  </div>
</section>

<section><h2 class="foldable" id="shopHead" data-target="shopBody">
  各店铺业绩 <span class="cnt" id="trendCnt"></span>
  <span class="foldArrow" id="shopArrow">▼</span>
</h2>
  <div class="card" id="shopBody">
    <div id="shopbars"></div>
  </div>
</section>

<section><h2 class="foldable" id="shopTblHead" data-target="shopTblBody">
  各店铺明细 <span class="cnt" id="shopCnt"></span>
  <span class="foldArrow" id="shopTblArrow">▼</span>
</h2>
  <div class="card tw" id="shopTblBody"><table id="shoptbl"></table></div>
</section>

<section class="notice">
  <h2 class="foldable" id="noticeHead" data-target="noticeBody">
    数据提示 <span class="cnt" id="noticeCnt"></span>
    <span class="foldArrow" id="noticeArrow">▼</span>
  </h2>
  <div class="card" id="noticeBody"></div>
</section>

<section>
  <h2 class="foldable" id="sumHead" data-target="sumBody">
    数据小结 <span class="cnt" id="sumTips"></span>
    <span class="foldArrow" id="sumArrow">▼</span>
  </h2>
  <div class="card" id="sumBody"><div id="summaryBody"></div></div>
</section>

<footer id="foot"></footer>
</div>

  /* 基准日 = 生成时按「时间」定死的那一天（见 Python 侧 meta.base_day）：

    if(pv > 0) cchg = (b.p - pv) / pv * 100;
    const cCls = cchg === null ? 'flat' : (cchg >= 0.5 ? 'up' : (cchg <= -0.5 ? 'down' : 'flat'));
    const cTxt = cchg === null ? '无对比' :
      `${cchg > 0 ? '▲' : (cchg < 0 ? '▼' : '—')} ${Math.abs(cchg).toFixed(1)}%`;
    bh += `<div class="srow${i===0?' top':''}">
      <div class="sname"><span class="idx">${i+1}</span>${b.nm.replace('蒙倩','')}
        <span class="schg ${cCls}" title="${cmpLabel}">${cTxt}</span></div>
      <div class="sline">
        <div class="sbar"><i style="width:${pct.toFixed(1)}%"></i></div>
        <span class="sval">${(b.p/10000).toFixed(2)}万</span>
        <span class="srate" style="color:${rc}">${rate.toFixed(0)}%</span>
      </div>
    </div>`;
  });
  document.getElementById('shopbars').innerHTML = bh || '<div class="ni">暂无数据</div>';
  document.getElementById('trendCnt').textContent =
    `${bars.length} 家　·　按业绩从高到低　·　右侧为数值%　·　右上角为${cmpLabel}涨跌`;

  // 店铺表（复用上面的 bars）
  const arr = bars.map(b=>({...b, rate: b.p>0 ? (b.r+b.a)/b.p*100 : 0}));

  let th = `<thead><tr><th>店铺</th><th style="text-align:right">业绩</th>
    <th style="text-align:right">环比</th><th style="text-align:right">数值</th>
    <th style="text-align:right">推广费占比</th>
    <th style="text-align:right">退款占比</th><th style="text-align:right">客单价</th></tr></thead><tbody>`;
  const totRate = P>0?(R+A)/P*100:0;
  const TOT = {P, R, A, O};
  arr.forEach(v=>{
    const rA = v.p>0 ? v.a/v.p*100 : 0;          // 推广费占比
    const rR = v.p>0 ? v.r/v.p*100 : 0;          // 退款占比
    const rt = rA + rR;                          // 数值
    const aov = v.o>0 ? v.p/v.o : 0;             // 客单价 = 业绩 / 成团单量
    const cls = rt>=46 ? 'r' : (rt>=42?'y':'g');
    const pv = prevAgg[v.nm] ? prevAgg[v.nm].p : 0;
    const cchg = pv > 0 ? (v.p - pv)/pv*100 : null;
    const cTxt = cchg === null ? '—' :
      `${cchg > 0 ? '▲' : (cchg < 0 ? '▼' : '—')} ${Math.abs(cchg).toFixed(1)}%`;
    const cCol = cchg === null ? 'var(--ink3)' : (cchg >= 0 ? 'var(--good)' : 'var(--bad)');
    th += `<tr><td class="sh">${v.nm.replace('蒙倩','')}</td>
      <td class="n">${(v.p/10000).toFixed(2)}万</td>
      <td class="n" style="color:${cCol};font-weight:800">${cTxt}</td>
      <td class="n"><span class="pill ${cls}">${rt.toFixed(2)}%</span></td>
      <td class="n">${rA.toFixed(2)}%</td>
      <td class="n">${rR.toFixed(2)}%</td>
      <td class="n">${aov.toFixed(2)}</td></tr>`;
  });
  // 合计行
  const tA = P>0?A/P*100:0, tR = P>0?R/P*100:0;
  const tAov = O>0 ? P/O : 0;
  const totPv = prevSel.reduce((a,d)=>a+byDay[d].p, 0);
  const totChg = totPv > 0 ? (P - totPv)/totPv*100 : null;
  const totChgTxt = totChg === null ? '—' :
    `${totChg > 0 ? '▲' : (totChg < 0 ? '▼' : '—')} ${Math.abs(totChg).toFixed(1)}%`;
  const totChgCol = totChg === null ? 'var(--ink3)' : (totChg >= 0 ? 'var(--good)' : 'var(--bad)');
  th += `<tr style="background:#fafcff;font-weight:800">
      <td class="sh">合计</td><td class="n">${(P/10000).toFixed(2)}万</td>
      <td class="n" style="color:${totChgCol}">${totChgTxt}</td>
      <td class="n"><span class="pill ${totRate>=46?'r':(totRate>=42?'y':'g')}">${totRate.toFixed(2)}%</span></td>
      <td class="n">${tA.toFixed(2)}%</td>
      <td class="n">${tR.toFixed(2)}%</td>
      <td class="n">${tAov.toFixed(2)}</td></tr></tbody>`;
  document.getElementById('shoptbl').innerHTML = th;
  document.getElementById('shopCnt').textContent = `${arr.length} 家`;

  // ===== 数据小结（跟随所选时间段）=====
  document.getElementById('sumTips').textContent =
    (w==='m'?'本月':(w===1?'当日':(w===3?'近3天':'近7天'))) + '口径';
  renderSummary(w, sel, prevSel, P, R, A, O, RO, pP, pR, pA);

  document.getElementById('foot').innerHTML =
    `数据源：飞书「运营数据登记」<br>生成时间 ${meta.gen}　·　看板每 10 分钟自动刷新可手动下拉`;
}

/* 迷你趋势线 —— 指标卡内的 sparkline */
function sparkline(vals, color){
  if(!vals || vals.length < 2) return '';
  const w = 130, h = 26, pad = 3;
  const mx = Math.max(...vals), mn = Math.min(...vals), rng = (mx - mn) || 1;
  const step = w / (vals.length - 1);
  const pts = vals.map((v,i)=>[i*step, h - pad - (v-mn)/rng*(h-pad*2)]);
  const d = pts.map((p,i)=>(i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const gid = 'sg' + Math.random().toString(36).slice(2, 8);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".2"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${d} L ${w} ${h} L 0 ${h} Z" fill="url(#${gid})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

/* 仪表盘 —— 数值水位 vs 46% 标准线 */
function renderGauge(cur){
  const el = document.getElementById('gauge'); if(!el) return;
  const STD = 46, MAX = 100;
  const W = 260, H = 162, cx = 130, cy = 136, R = 98, SW = 17;
  const a0 = Math.PI, a1 = Math.PI * 2;
  const clamp = v => Math.max(0, Math.min(MAX, v));
  const ang = v => a0 + (clamp(v) / MAX) * (a1 - a0);
  const pt = (a, r) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const arc = (from, to, r) => {
    const [x1, y1] = pt(ang(from), r), [x2, y2] = pt(ang(to), r);
    const large = (ang(to) - ang(from)) > Math.PI ? 1 : 0;
    return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  };
  const cvar = cur >= 46 ? '#e5484d' : (cur >= 42 ? '#e08600' : '#0ea472');
  const diff = cur - STD;
  const [sx1, sy1] = pt(ang(STD), R - SW/2 - 4), [sx2, sy2] = pt(ang(STD), R + SW/2 + 4);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:262px">
    <path d="${arc(0, MAX, R)}" fill="none" stroke="#eef1f6" stroke-width="${SW}" stroke-linecap="round"/>
    <path d="${arc(0, cur, R)}" fill="none" stroke="${cvar}" stroke-width="${SW}" stroke-linecap="round"/>
    <line x1="${sx1.toFixed(1)}" y1="${sy1.toFixed(1)}" x2="${sx2.toFixed(1)}" y2="${sy2.toFixed(1)}"
          stroke="#12151b" stroke-width="2.4" stroke-linecap="round"/>
    <text x="${cx}" y="${cy - 38}" text-anchor="middle" font-size="43" font-weight="800"
          fill="#12151b" letter-spacing="-2">${cur.toFixed(1)}<tspan font-size="19" font-weight="700"
          fill="#5a6474">%</tspan></text>
    <text x="${cx}" y="${cy - 8}" text-anchor="middle" font-size="13" font-weight="700"
          fill="${diff > 0 ? '#e5484d' : '#0ea472'}">${diff > 0 ? '高于' : '低于'}标准线 ${Math.abs(diff).toFixed(1)}pt</text>
    <text x="12" y="${cy + 15}" font-size="11.5" fill="#98a1b0" font-weight="600">0%</text>
    <text x="${W - 12}" y="${cy + 15}" text-anchor="end" font-size="11.5" fill="#98a1b0" font-weight="600">${MAX}%</text>
  </svg>`;
  const tag = document.getElementById('gaugeTag');
  if(tag){ tag.textContent = '标准线 ' + STD + '%'; tag.className = 'tag' + (cur >= 46 ? ' bad' : (cur >= 42 ? '' : ' good')); }
}

/* 环形图 —— 成本结构（退款 / 推广费 / 其他 / 净额） */
function renderDonut(P, R, A){
  const el = document.getElementById('donut'); if(!el) return;
  const rest = Math.max(0, P - R - A);
  const parts = [
    { n: '退款',     v: R,            c: '#e5484d' },
    { n: '推广费',   v: A,            c: '#e08600' },
    { n: '其他成本', v: rest * 0.22,  c: '#7c5cf0' },
    { n: '净额',     v: rest * 0.78,  c: '#0ea472' }
  ].filter(x => x.v > 0);
  const tot = parts.reduce((a, b) => a + b.v, 0) || 1;
  const S = 168, cx = S/2, cy = S/2, R1 = 62, SW = 26, rMid = R1 - SW/2;
  let a = -Math.PI/2, ring = '';
  parts.forEach(pp => {
    const sweep = pp.v / tot * Math.PI * 2;
    const a2 = a + sweep;
    const [x1, y1] = [cx + rMid*Math.cos(a), cy + rMid*Math.sin(a)];
    const [x2, y2] = [cx + rMid*Math.cos(a2), cy + rMid*Math.sin(a2)];
    const large = sweep > Math.PI ? 1 : 0;
    if(sweep > 0.001) ring += `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${rMid} ${rMid} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}"
      fill="none" stroke="${pp.c}" stroke-width="${SW}" stroke-linecap="butt"/>`;
    a = a2;
  });
  const rate = (R + A) / tot * 100;
  const rows = parts.map(pp => `<div style="display:flex;align-items:center;gap:7px;font-size:13px;
      font-weight:700;color:var(--ink2);margin-bottom:7px">
      <i style="width:10px;height:10px;border-radius:3px;background:${pp.c};flex:none"></i>
      <span style="flex:1">${pp.n}</span>
      <b style="color:var(--ink);font-variant-numeric:tabular-nums">${(pp.v/tot*100).toFixed(1)}%</b>
    </div>`).join('');
  el.innerHTML = `<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center">
    <svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" style="flex:none">${ring}
      <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="25" font-weight="800" fill="#12151b" letter-spacing="-1">${rate.toFixed(1)}%</text>
      <text x="${cx}" y="${cy + 17}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#98a1b0">退款+推广</text>
    </svg>
    <div style="min-width:118px">${rows}</div>
  </div>`;
  const tag = document.getElementById('donutTag');
  if(tag) tag.innerHTML = fmtMoney(P);
}

/* 折线图 —— 每日业绩走势（带面积渐变 + 数据点 + 悬浮提示） */
function renderLine(sel){
  const box = document.getElementById('linechart'); if(!box) return;
  const n = sel.length;
  if(n < 2){ box.innerHTML = '<div style="color:var(--ink3);font-size:14px;padding:20px 0">数据不足，至少需要 2 天</div>'; return; }
  const vals = sel.map(d => byDay[d].p);
  const mx = Math.max(...vals), mn = Math.min(...vals);
  const PL = 52, PR = 18, PT = 18, PB = 34;
  const cw = Math.max(560, n * 62);
  const W = cw + PL + PR, H = 250;
  const gx = i => PL + (n === 1 ? 0 : i * (cw / (n - 1)));
  const gy = v => PT + (H - PT - PB) * (1 - (v - mn * 0.9) / ((mx * 1.08 - mn * 0.9) || 1));
  const pts = vals.map((v, i) => [gx(i), gy(v)]);
  const line = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const area = line + ` L ${pts[n-1][0].toFixed(1)} ${H-PB} L ${pts[0][0].toFixed(1)} ${H-PB} Z`;
  // Y 轴刻度
  let grid = '', ylab = '';
  for(let t = 0; t <= 4; t++){
    const v = mn * 0.9 + (mx * 1.08 - mn * 0.9) * (t / 4);
    const y = PT + (H - PT - PB) * (1 - t / 4);
    grid += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}"
             stroke="#eef1f6" stroke-width="1"/>`;
    ylab += `<text x="${PL-9}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="11.5"
             fill="#98a1b0" font-weight="600">${(v/10000).toFixed(0)}万</text>`;
  }
  // 数据点 + X 轴
  let dots = '', xlab = '';
  const peakIdx = vals.indexOf(mx);
  pts.forEach((q, i) => {
    const isPeak = i === peakIdx;
    dots += `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${isPeak ? 5 : 3.6}"
        fill="#fff" stroke="${isPeak ? '#0ea472' : '#2563eb'}" stroke-width="${isPeak ? 3 : 2.4}">
        <title>${sel[i]}　${(vals[i]/10000).toFixed(2)}万</title></circle>`;
    if(isPeak) dots += `<text x="${q[0].toFixed(1)}" y="${(q[1]-11).toFixed(1)}" text-anchor="middle"
        font-size="11.5" font-weight="800" fill="#0ea472">最高 ${(mx/10000).toFixed(1)}万</text>`;
    if(n <= 16 || i % Math.ceil(n/12) === 0){
      const [yy, mm, dd] = sel[i].split('-');
      xlab += `<text x="${q[0].toFixed(1)}" y="${H-13}" text-anchor="middle" font-size="11.5"
          fill="#98a1b0" font-weight="600">${+mm}/${+dd}</text>`;
    }
  });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <defs><linearGradient id="lgArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}${ylab}
    <path d="${area}" fill="url(#lgArea)"/>
    <path d="${line}" fill="none" stroke="#2563eb" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${xlab}
  </svg>`;
  const lg = document.getElementById('linelegend');
  if(lg){
    const avg = vals.reduce((a,b)=>a+b,0) / n;
    lg.innerHTML = `<span><i style="background:#2563eb"></i>每日业绩（万）</span>
      <span><i style="background:#0ea472"></i>最高 ${(mx/10000).toFixed(2)}万（${sel[peakIdx]}）</span>
      <span><i style="background:#98a1b0"></i>日均 ${(avg/10000).toFixed(2)}万</span>`;
  }
}


function renderNotice(){
  // 基准日 = 最近一个登记完整的日期（见 resolveBaseDay）
  const last = resolveBaseDay();
  if(!last){ document.getElementById('noticeBody').innerHTML='<div class="ni ok">暂无数据</div>'; return; }

  // 应登店铺 = 近 21 天出现 >= 15 次
  const win = days.slice(-21), freq = {};
  win.forEach(d=>Object.keys(byDay[d].shops||{}).forEach(nm=>{ freq[nm]=(freq[nm]||0)+1; }));
  const base = Object.keys(freq).filter(nm=>freq[nm]>=15);
  const MIN_FULL = Math.max(10, Math.floor(base.length*0.8));

  const i0 = days.indexOf(last);
  const prev1 = days[i0-1];                       // 前一天
  const prev3 = days.slice(Math.max(0,i0-3), i0); // 近3天（不含基准日）

  let html = '';

  /* ---- ① 业绩下滑 >5%（对比近3天均值）---- */
  const down = [];
  if(prev3.length >= 2){
    const cur = byDay[last].shops||{};
    Object.keys(cur).forEach(nm=>{
      const vals = prev3.filter(d=>byDay[d].shops && byDay[d].shops[nm]).map(d=>byDay[d].shops[nm].p);
      if(vals.length < 2) return;
      const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
      if(avg <= 0) return;
      const chg = (cur[nm].p - avg)/avg*100;
      if(chg <= -5) down.push({nm, avg, p:cur[nm].p, chg});
    });
    down.sort((a,b)=>a.chg-b.chg);
  }
  html += `<div class="nblk">
    <h3>业绩下滑 &gt; 5% <span class="n ${down.length?'r':'g'}">${down.length?'★ '+down.length+' 家':'无'}</span>
    <span class="n" style="background:#fff">对比近3天均值 ${prev3.length?shortD(prev3[0])+'~'+shortD(prev3[prev3.length-1]):'—'}</span></h3>`;
  if(down.length){
    down.forEach(v=>{
      html += `<div class="ni" style="display:block">
        <div class="nm" style="min-width:0;font-size:16.5px;margin-bottom:5px">${v.nm.replace('蒙倩','')}</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <span class="dt">均值 ${(v.avg/10000).toFixed(2)}万 → 当日 ${(v.p/10000).toFixed(2)}万</span>
          <span class="bad">${v.chg.toFixed(1)}%</span></div></div>`;
    });
  } else {
    html += `<div class="ni ok">✓ 无店铺业绩下滑超过 5%</div>`;
  }
  html += `</div>`;

  /* ---- ② 异常数据（对比前一天）---- */
  const anom = [];
  if(prev1){
    const cur = byDay[last].shops||{}, old = byDay[prev1].shops||{};
    Object.keys(cur).forEach(nm=>{
      if(!old[nm]) return;
      const o=old[nm], n=cur[nm];
      if(o.p>0){
        const pct=(n.p-o.p)/o.p*100;
        if(Math.abs(pct)>=50 && Math.abs(n.p-o.p)>=300)
          anom.push({nm, t:'业绩', txt:`${(o.p/10000).toFixed(2)}万 → ${(n.p/10000).toFixed(2)}万`, v:pct.toFixed(0)+'%', sev:Math.abs(pct)});
      }
      if(o.p>0 && n.p>0){
        const ro=(o.r+o.a)/o.p*100, rn=(n.r+n.a)/n.p*100;
        if(Math.abs(rn-ro)>=20)
          anom.push({nm, t:'数值', txt:`${ro.toFixed(0)}% → ${rn.toFixed(0)}%`, v:(rn-ro>=0?'+':'')+(rn-ro).toFixed(0)+'pt', sev:Math.abs(rn-ro)*3});
      }
    });
    anom.sort((a,b)=>b.sev-a.sev);
  }
  html += `<div class="nblk">
    <h3>异常数据 <span class="n ${anom.length?'y':'g'}">${anom.length?anom.length+' 项':'无'}</span>
    <span class="n" style="background:#fff">对比 ${prev1?shortD(prev1):'—'}　业绩±50%且差≥300 / 数值±20pt</span></h3>`;
  if(anom.length){
    anom.forEach(v=>{
      html += `<div class="ni" style="display:block">
        <div class="nm" style="min-width:0;font-size:16.5px;margin-bottom:5px">${v.nm.replace('蒙倩','')}</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <span class="dt">${v.t} ${v.txt}</span><span class="warn">${v.v}</span></div></div>`;
    });
  } else {
    html += `<div class="ni ok">✓ 未发现异常波动</div>`;
  }
  html += `</div>`;

  /* ---- ③ 近7天登记漏登（以基准日为准往前7天）---- */
  const recent = days.slice(Math.max(0, i0-6), i0+1);
  const miss = [];
  recent.forEach(d=>{
    const mm = base.filter(nm=>!(byDay[d].shops && byDay[d].shops[nm]));
    if(mm.length) miss.push({d, mm});
  });
  const curCnt = Object.keys(byDay[last].shops||{}).length;
  html += `<div class="nblk">
    <h3>登记漏登 <span class="n ${miss.length?'r':'g'}">${miss.length?'★ '+miss.reduce((a,b)=>a+b.mm.length,0)+' 家次':'无'}</span>
    <span class="n" style="background:#fff">近7天　当日 ${curCnt}/${base.length} 家</span></h3>`;
  if(miss.length){
    miss.forEach(v=>{
      html += `<div class="ni" style="display:block">
        <div class="dt" style="font-weight:800;font-size:16.5px;margin-bottom:6px">${shortD(v.d)}　缺 ${v.mm.length} 家</div>
        <div class="bad" style="line-height:1.9">${v.mm.map(x=>x.replace('蒙倩','')).join('　')}</div></div>`;
    });
  } else {
    html += `<div class="ni ok">✓ 近7天登记齐全</div>`;
  }
  html += `</div>`;

  /* ---- ④ 数据小结（跟随时间段，见 renderSummary）---- */
  document.getElementById('noticeBody').innerHTML = html;
  document.getElementById('noticeCnt').textContent =
    `基准日 ${last}　·　${down.length+anom.length+miss.length?'有需关注项':'全部正常'}`;
  // 暴露给 renderSummary 复用
  window.__notice = {down, anom, miss, base, last, prev1};
}

/* ============ 数据小结（跟随所选时间段）============ */
function renderSummary(w, sel, prevSel, P, R, A, O, RO, pP, pR, pA){
  const box = document.getElementById('summaryBody');
  if(!box || !sel.length) return;
  const n = sel.length;
  const rate = P>0 ? (R+A)/P*100 : 0;
  const prevRate = pP>0 ? (pR+pA)/pP*100 : 0;
  const dPct  = pP>0 ? (P-pP)/pP*100 : null;
  const dRate = pP>0 ? rate-prevRate : null;
  const perDay = P/n;
  const perDayPrev = prevSel.length ? pP/prevSel.length : 0;

  // 每日走势（用于判趋势 / 波动）
  const dailyP = sel.map(d=>byDay[d].p);
  const mx = Math.max(...dailyP), mn = Math.min(...dailyP);
  const mxDay = sel[dailyP.indexOf(mx)], mnDay = sel[dailyP.indexOf(mn)];
  // 趋势：只在 ≥6 天时算，且前后两段严格等长（否则会得出假的下滑）
  let firstAvg = 0, lastAvg = 0, trend = null;
  if(n >= 6){
    const h = Math.floor(n/2);
    const a1 = dailyP.slice(0, h), a2 = dailyP.slice(n - h);
    firstAvg = a1.reduce((a,b)=>a+b,0) / a1.length;
    lastAvg  = a2.reduce((a,b)=>a+b,0) / a2.length;
    if(firstAvg > 0) trend = (lastAvg - firstAvg) / firstAvg * 100;
  }

  const lvl = rate>=46?'超标准线':(rate>=42?'逼近标准线':'健康');
  const NT = window.__notice || {};
  const down = NT.down || [], miss = NT.miss || [];

  // 口径标签
  const periodName = (w==='m') ? '本月' : (w===1?'当日':(w===3?'近3天':'近7天'));
  const cmpName    = (w==='m') ? '上月同期' : (w===1?'前一日':(w===3?'前 3 天':'前 7 天'));

  let s = `<div class="nsum">`;

  // —— 概况 ——
  s += `<b>【${periodName}概况】</b><br>`;
  s += `${sel[0]} ~ ${sel[sel.length-1]}，共 ${n} 天${n>1?`（日均 ${(perDay/10000).toFixed(2)}万）`:''}。`;
  s += `合计业绩 <span class="hi">${(P/10000).toFixed(1)}万</span>`;
  if(dPct !== null){
    const ok = dPct>=0;
    s += `，较${cmpName} <b class="${ok?'':'bad'}" style="${ok?'color:#047857':''}">${ok?'+':''}${dPct.toFixed(1)}%</b>`;
    if(perDayPrev>0 && n>1) s += `（日均 ${(perDayPrev/10000).toFixed(2)}万 → ${(perDay/10000).toFixed(2)}万）`;
    s += `。`;
  } else { s += `。`; }
  s += `<br>退款 <b>${(R/10000).toFixed(1)}万</b>、推广 <b>${(A/10000).toFixed(1)}万</b>`;
  s += `，数值 <span class="hi">${rate.toFixed(2)}%</span>`;
  if(dRate !== null){
    const good = dRate<=0;   // 数值越低越好
    s += `（较${cmpName} <b style="color:${good?'#047857':'#b45309'}">${dRate>=0?'+':''}${dRate.toFixed(1)}pt</b>）`;
  }
  s += `，整体${lvl}。<br>`;
  if(n>1) s += `单量 ${O.toFixed(0)} 单、退款 ${RO.toFixed(0)} 单，退款率 ${O>0?(RO/O*100).toFixed(1):'0.0'}%。`;

  // —— 走势（≥6 天才显示，3 天以内看趋势没意义）——
  if(n >= 6){
    s += `<br><br><b>【走势】</b><br>`;
    s += `最高 <b>${shortD(mxDay)} ${(mx/10000).toFixed(1)}万</b>，最低 <b>${shortD(mnDay)} ${(mn/10000).toFixed(1)}万</b>`;
    s += `，峰谷差 ${((mx-mn)/10000).toFixed(1)}万。`;
    if(trend !== null){
      const dir = trend>=3 ? '上升' : (trend<=-3 ? '下滑' : '基本平稳');
      s += `<br>前段日均 ${(firstAvg/10000).toFixed(2)}万 → 后段日均 ${(lastAvg/10000).toFixed(2)}万，<b style="color:${trend>=0?'#047857':'#be123c'}">${dir} ${trend>=0?'+':''}${trend.toFixed(1)}%</b>。`;
    }
  }

  // —— 问题 ——
  s += `<br><br><b>【问题】</b><br>`;
  if(down.length) s += `⚠️ <b>${down.length} 家</b>业绩下滑超 5%（${down.slice(0,3).map(v=>v.nm.replace('蒙倩','')).join('、')}${down.length>3?' 等':''}）；<br>`;
  else s += `✅ 无店铺业绩明显下滑；<br>`;
  if(rate >= 46) s += `⚠️ 数值 <b>${rate.toFixed(1)}%</b> 已超标准线 46%，退款+推广吃掉了近一半业绩；<br>`;
  else if(rate >= 42) s += `⚠️ 数值 ${rate.toFixed(1)}%，逼近标准线 46%，需盯住不继续走高；<br>`;
  else s += `✅ 数值 ${rate.toFixed(1)}%，低于标准线 46%，处于健康区间；<br>`;
  if(miss.length) s += `⚠️ 近7天有 <b>${miss.reduce((a,b)=>a+b.mm.length,0)} 家次</b>未登记，会影响统计准确性；<br>`;
  else s += `✅ 近7天登记齐全；<br>`;

  // —— 建议（按时间段给出不同侧重）——
  const tips = [];
  if(w === 1){
    if(down.length) tips.push(`逐店核对下滑店铺的当日推广与活动，确认是流量问题还是转化问题`);
    if(rate >= 25) tips.push(`当日数值偏高，检查是否集中投流或集中退款，次日及时收一收`);
    tips.push(`当日数据只作即时监控，趋势判断看「近7天」`);
  } else if(w === 3){
    if(dPct !== null && dPct < -10) tips.push(`3天环比下滑 ${Math.abs(dPct).toFixed(1)}%，建议排查是活动结束还是竞品动作`);
    if(dRate !== null && dRate > 2) tips.push(`数值 3 天回升 ${dRate.toFixed(1)}pt，优先看退款率高的店`);
    tips.push(`3 天口径适合验证调整动作的即时效果，别用它判断长期趋势`);
  } else if(w === 7){
    if(trend !== null && trend < -5) tips.push(`周内呈下滑走势（${trend.toFixed(1)}%），建议按周维度复盘投放结构`);
    else if(trend !== null && trend > 5) tips.push(`周内呈上升走势（+${trend.toFixed(1)}%），可趁势加大高效店的投放`);
    tips.push(`周维度是复盘的最佳粒度：按店看排名变化，重点扶持前 3 名、帮扶后 3 名`);
    if(rate >= 25) tips.push(`周数值 ${rate.toFixed(1)}% 偏高，建议把推广预算往投产高的店倾斜`);
  } else {
    if(dPct !== null && dPct < 0) tips.push(`本月较上月同期下滑 ${Math.abs(dPct).toFixed(1)}%，需在月中前找出是流量还是转化的问题`);
    else if(dPct !== null) tips.push(`本月较上月同期增长 ${dPct.toFixed(1)}%，可总结做对了什么并复制到其他店`);
    tips.push(`月度看结构：各店业绩占比、数值分布是否合理，避免过度依赖头部店`);
    tips.push(`建议月中做一次「进度提醒」，对照月度目标决定下半月投放节奏`);
  }
  s += `<br><b>【建议】</b><br>`;
  tips.forEach((t,i)=>{ s += `${i+1}. ${t}<br>`; });

  s += `</div>`;
  box.innerHTML = s;
}

/* 折叠：每个板块都能收/展
   长板块（趋势/店铺业绩/店铺明细）默认收起，方便看顶部指标；
   短板块（数据提示/数据小结）默认展开。 */
[
  ['coreHead','coreBody',     false],
  ['trendHead','trendBody',   true ],
  ['shopHead','shopBody',     true ],
  ['shopTblHead','shopTblBody', true ],
  ['noticeHead','noticeBody', false],
  ['sumHead','sumBody',       false]
].forEach(function(p){
  const head = document.getElementById(p[0]);
  const body = document.getElementById(p[1]);
  if(!head || !body) return;
  if(p[2]){ head.classList.add('closed'); body.style.display = 'none'; }
  head.addEventListener('click', ()=>{
    const closed = head.classList.toggle('closed');
    body.style.display = closed ? 'none' : '';
  });
});

document.getElementById('tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  const w = t.dataset.w;
  render(w === 'm' ? 'm' : +w);
});

/* ══ 访问密码门（密码存加盐哈希，不留明文；登录状态存 sessionStorage）══ */
(function(){
  var KEY = 'shiyi-daily-ok', HASH = 'e818342';
  var gate = document.getElementById('gate'), app = document.getElementById('app');
  var pw = document.getElementById('pw'), btn = document.getElementById('pwb'), err = document.getElementById('pwerr');
  if(!gate || !app) return;
  function fnv(s){
    var x = 0x811c9dc5;
    for(var i=0;i<s.length;i++){ x ^= s.charCodeAt(i); x = Math.imul(x, 0x01000193) >>> 0; }
    return x.toString(16);
  }
  function unlock(){ gate.style.display = 'none'; app.style.display = ''; }
  try{ if(sessionStorage.getItem(KEY) === '1'){ unlock(); return; } }catch(e){}
  function tryGo(){
    if(fnv(pw.value + 'shiyi-daily-2026') === HASH){
      try{ sessionStorage.setItem(KEY, '1'); }catch(e){}
      unlock();
    }else{
      err.textContent = '密码不对，请重试';
      pw.value = ''; pw.focus();
    }
  }
  btn.addEventListener('click', tryGo);
  pw.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryGo(); });
  pw.focus();
})();

renderNotice();   // 先算公告区（给数据小结提供下滑/漏登数据），固定口径
render(7);        // 再渲染主视图（含跟随时间段的数据小结）

/* 表头冻结：动态跟随顶部 KPI 卡片的高度，避免被遮住 */
function syncStickyTop(){
  const k = document.querySelector('.kpis');
  const h = k ? Math.round(k.getBoundingClientRect().height) : 0;
  document.documentElement.style.setProperty('--kpiH', h + 'px');
}
syncStickyTop();
window.addEventListener('resize', syncStickyTop);
window.addEventListener('orientationchange', function(){ setTimeout(syncStickyTop, 120); });
document.addEventListener('click', function(){ setTimeout(syncStickyTop, 80); });   // 切时间段/折叠后重算
setTimeout(syncStickyTop, 300);
