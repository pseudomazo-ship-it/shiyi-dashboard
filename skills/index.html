成出来的 HTML 等于白改，必须落回生成器脚本。", "full_description": "用 Excel 源数据重建静态 HTML 看板并发布到 GitHub Pages：只替换 HTML 里的数据对象（QDATA / 内嵌 JS 费率数组），保持密码、校验逻辑、CSS、筛选排序 JS 一律不动；推送后必须回读线上页面、断言新值在旧值没了，才算完成。覆盖三类看板 —— 主体财务看板（仓库内 /finance/）、快递决策看板（独立仓库算法版 + /logistics/ 速查表版，两份别混）、运营日报周报月报（/daily/、/weekly/、/monthly/，与飞书「运营数据登记」同一个 Base）。源表更新后要重新生成并上线看板、要改看板上的费率/调价数据、或要更新看板右上角的版本日期时用。⚠️ 三个反复踩的点：改内嵌数据必须「块内替换」不能全局 replace（同一个数字在多个对象里都出现，全局替换会改坏不报错）；看板带版本/日期的地方通常有 4 处（title、右上角 chip、header 说明、页脚版本号），只改一处会被退回；只改生成出来的 HTML 等于白改，改动必须落回生成器脚本。", "version": "未声明", "category": "数据分析", "agent": "Hermes", "install_method": "ZIP 手动", "package_url": "packages/gh-pages-dashboard-maintenance-7e8c91-2026.10.08.zip", "source_url": "", "source_note": "本机 Hermes 技能目录", "reference_urls": [], "notes": "本地技能目录重打包，不是官方发行包。仅包含技能文件，不包含运行时、插件服务、账号授权或第三方依赖；未进行完整安全审计和跨环境安装实测。公开分发前请核实授权与内容。", "updated_at": "2026.10.08", "package_size": 108442, "sha256": "66a2c0fdeb04ff8247c026e52819a24cbfd3746130305dc2f6abb860fb5c8b0a", "package_root": "gh-pages-dashboard-maintenance-7e8c91", "scene": "重建看板 · 发Pages", "icon": "📝", "id": "skill-290"}, {"id": "skill-291", "name": "google-workspace", "description": "操作 Gmail、日历、Drive、Docs、Sheets。需要在 Google 那套服务之间处理邮件和文档时用。", "full_description": "操作 Gmail、日历、Drive、Docs、Sheets。需要在 Google 那套服务之间处理邮件和文档时用。", "version": "1.2.0", "category": "办公协同", "agent": "Hermes", "install_method": "ZIP 手动", "package_url": "packages/google-workspace-a1f88e-2026.10.07.zip", "source_url": "", "source_note": "本机 Hermes 技能目录", "reference_urls": [], "notes": "本地技能目录重打包，不是官方发行包。仅包含技能文件，不包含运行时、插件服务、账号授权或第三方依赖；未进行完整安全审计和跨环境安装实测。公开分发前请核实授权与内容。", "updated_at": "2026-10-07", "package_size": 26113, "sha256": "7055f0fb1a7f9f1dce72e24041b6b80769f1451a3dbdf3a23aadcb0dcdf83bdd", "package_root": "google-workspace-a1f88e", "scene": "管谷歌套件 · 邮件日历", "icon": "📝", "original": false, "exclusive": null}, {"id": "skill-292", "name": "hermes-desktop-session-recovery", "description": "聊天会话丢失、被隐藏或反复消失时做恢复。某个窗口的对话记录找不到了、需要安全找回时用。", "full_desc
