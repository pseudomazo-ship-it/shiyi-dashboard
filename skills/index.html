var scat="总排行", sq="";

var cats=["总排行", "近期最热", "最新上传", "AI 增强", "办公", "效率", "开发", "设计", "内容创作", "专业技能"], cdesc={"总排行": "综合装机量排名", "近期最热": "最近热度上升最快", "最新上传": "刚刚上架的新技能", "AI 增强": "增强 Agent 能力的工具", "办公": "办公文档与协作", "效率": "自动化与提效", "开发": "开发调试与工程化", "设计": "视觉与前端设计", "内容创作": "写作、图像与音视频", "专业技能": "垂直行业专业能力"};
function paintCats(){
  cs.innerHTML=cats.map(function(c){var n=SHOP.filter(function(x){return x.c===c}).length;
    return '<button type="button" data-cat="'+esc(c)+'" class="'+(c===scat?"on":"")+'">'+esc(c)+' <em>'+n+'</em></button>'}).join("");
}
function paint(){
  var list=SHOP.filter(function(x){return x.c===scat});
  if(sq){var q=sq.toLowerCase();list=list.filter(function(x){return (x.en+" "+x.cn+" "+x.d).toLowerCase().indexOf(q)>=0})}
  g.innerHTML=list.length?list.map(function(x){
    var lv=esc(x.g).replace("+","\\+");
    return '<article class="shop-card" data-u="'+esc(x.u)+'"><div class="row1"><span class="en">'+esc(x.en)+'</span>'
      +'<span class="lv lv-'+lv+'">'+esc(x.g)+'</span></div>'
      +(x.cn?'<span class="cn">'+esc(x.cn)+'</span>':"")
      +(x.d?'<p class="de">'+esc(x.d)+'</p>':"")
      +'<div class="foot"><span>安装 '+esc(x.i)+'</span>'+(x.h?'<span>热度 '+esc(x.h)+'</span>':"")+'</div></article>'
  }).join(""):'<div class="shop-empty">没有匹配的技能</div>';
  var c=document.getElementById("shop-count"); if(c) c.textContent="第 "+(cats.indexOf(scat)+1)+" 类 · "+list.length+" 个";
}
cs.addEventListener("click",function(e){var b=e.target.closest("button[data-cat]"); if(!b)return;

g.addEventListener("click",function(e){var c=e.target.closest(".shop-card"); if(!c)return;

  var sv=document.getElementById("shop-view"); if(sv) sv.hidden=!shop;
  var lv=document.getElementById("category-buttons"); if(lv) lv.style.display=shop?"none":"";
  var sh=document.querySelector("#local-count-head"); if(sh) sh.style.display=shop?"none":"";
  ["sentinel","category"].forEach(function(id){var el=document.getElementById(id); if(el) el.style.display=shop?"none":""});
  var ws=g.closest("main")?g:null;
  document.querySelectorAll("#skill-content .section-head, #skill-content .workspace").forEach(function(el){el.style.display=shop?"none":""});
  if(shop){document.querySelectorAll("#skill-content .src-tabs, #shop-view").forEach(function(el){el.style.display=""});paintCats();paint()}
  else{document.querySelectorAll("#skill-content .section-head, #skill-content .workspace").forEach(function(el){el.style.display=""})}
  window.scrollTo({top:0,behavior:"smooth"});
});
var si=document.getElementById("search");
if(si) si.addEventListener("input",function(e){var v=(e.target.value||"").trim();
  var sv=document.getElementById("shop-view");
  if(sv&&!sv.hidden){sq=v;paint()} });
paintCats(); paint();
})();

: "goods-shipment-mix-report-45aef6", "scene": "发货占比 · 按月出表", "icon": "📦", "original": true, "exclusive": null}, {"id": "skill-225", "name": "huosun-qianyeji-hesuan", "description": "按店铺业绩、推广费与退款算「数值」（=(退款+推广费)÷业绩，标准线 46%）与欠公司业绩（仅超标为正）。分单链／新店，各店取整到分再求和。要算货损欠业绩时用。", "full_description": "按店铺业绩、推广费与退款算「数值」（=(退款+推广费)÷业绩，标准线 46%）与欠公司业绩（仅超标为正）。分单链／新店，各店取整到分再求和。要算货损欠业绩时用。\n数值标准线 46%；欠业绩 = 业绩 ×（数值 − 46%），只有超标才是正数。分单链与新店两类分别算，各店金额取整到分再求和。", "version": "未声明", "category": "电商运营", "agent": "Hermes", "install_method": "ZIP 手动", "package_url": "packages/huosun-qianyeji-hesuan-edc13e-2026.10.07.zip", "source_url": "", "source_note": "本机 Hermes 技能目录", "reference_urls": [], "notes": "本地技能目录重打包，不是官方发行包。仅包含技能文件，不包含运行时、插件服务、账号授权或第三方依赖；未进行完整安全审计和跨环境安装实测。公开分发前请核实授权与内容。", "updated_at": "2026-10-07", "package_size": 8563, "sha256": "cebc7c8b3519be14d9b410b58d5bd634676a0b501d60b4e483a41f1653aacaa8", "package_root": "huosun-qianyeji-hesuan-edc13e", "scene": "算货损 · 欠业绩", "icon": "💰", "original": true, "exclusive": null}, {"id": "skill-226", "name": "kuaidi-duizhang", "description": "快递对账：按发货货品重量判段→查快递收费档→核结算表合理性；含双仓（岑溪云仓＋襄阳仓+0.3）、偏远档位与东三西四占比规则。要核快递账单收费对不对时用。", "full_description": "快递对账：按发货货品重量判段→查快递收费档→核结算表合理性；含双仓（岑溪云仓＋襄阳仓+0.3）、偏远档位与东三西四占比规则。要核快递账单收费对不对时用。\n重量超标 = ERP 标准重量 vs 账单结算重量。双仓口径：岑溪云仓 + 襄阳仓（+0.3）。海南停发中通（转襄阳仓圆通≤3kg／邮政>3kg）、广深强制圆通。", "version": "未声明", "category": "电商运营", "agent": "Hermes", "install_method": "ZIP 手动", "package_url": "packages/kuaidi-duizhang-0bf73c-2026.10.07.zip", "source_url": "", "source_note": "本机 Hermes 技能目录", "reference_urls": [], "notes": "本地技能目录重打包，不是官方发行包。仅包含技能文件，不包含运行时、插件服务、账号授权或第三方依赖；未进行完整安全审计和跨环境安装实测。公开分发前请核实授权与内容。", "updated_at": "2026-10-07", "package_size": 3718, "sha256": "1da7c50922ffe5c0dc0f10a361d89471811e32eb8d3325f66c8c70d8452b4a77", "package_root": "kuaidi-duizhang-0bf73c", "scene": "快递对账 · 核账单", "icon": "🚚", "original": true, "exclusive": null}, {"name": "linghangyuan-overtime", "description": "读飞书每日登记，按「领航员综合分行业排名」判定次日谁加班：当天值比前一天低、且比该店近7天均值低，两条都低才算加班；综合分≥60% 的店属合格不参与，个人店不参与。一人负责的店有一家加班，此人次日加班半小时；加班人数过半则总监陪同。每天16:00自动跑，喊「加班通知」可随时手动出。", "full_description": "跑领航员加班判定：读飞书「领航员·每日登记」全表，按「领航员综合分行业排名」逐个运营判定次日是否加班 —— 某个店当天值比前一天低、且比该店近 7 天均值低，两条都低才算加班（任一条高于或等于都不算）；综合分 ≥60% 的店铺属合格、不参与；个人店不参与。一个运营只要他负责的店里有一家被判加班，这个运营次日就要加班半小时；加班运营人数过半，总监（十一）陪同。每天 16:00 自动跑并推送，可随时喊口令「加班通知」手动出一次；也能指定日期回看历史判定。输出固定：【领航员/Dsr登记】+ 日期 + 逐人逐店（前值→现值、7天均）+ 十一是否需陪同。", "version": "1.1.0", "category": "电商运营", "agent": "Hermes", "install_method": "ZIP 手动", "package_url": "packages/linghangyuan-overtime-28c110-2026.10.08.zip", "source_url": "", "source_note": "本机 Hermes 技能目录", "reference_urls": [], "notes": "本地技能目录重打包，不是官方发行包。仅包含技能文件，不包含运行时、插件服务、账号授权或第三方依赖；未进行完整安全审计和跨环境安装实测。公开分发前请核实授权与内容。", "updated_at": "2026.10.08", "package_size": 12644, "sha256": "7514523c0f3f5abe21dd603e9288bb6a595624b07985ea67bee7e3042b31e18b", "package_root": "linghangyuan-overtime-28c110", "scene": "算加班 · 出通知", "icon": "⏰", "original": true, "id": "skill-227"}, {"name": "logistics-bill-audit", "description": "快递与云仓月度对账单整表核对：重量段与收费是否对应、偏远加价、超区退件、重复计费、与ERP标准重量差异，「确实多收」与「待确认」分开列。", "full_description": "快递和云仓的月度对账单整表核对，逐项列出问题项与待确认项，不是只看总额。核对口径：重量段与收费标准是否对应、偏远地区加价、超区与退件费用、重复计费、账单结算重量与 ERP 标准重量的差异。输出要把「确实多收」和「口径不同、需跟对方确认」分成两类，不混在一起。月底收到结算账单、要确认有没有多收漏收时用。⚠️ 分工：本技能只管「查对方有没有多收」；价格表/重量判档/仓库分配看 kuaidi-duizhang；偏远占比规划看 express-region-planning。", "version": "未声明", "category": "电商运营", "agent": "Hermes", "install_method": "ZIP 手动", "package_url": "packages/logistics-bill-audit-67cf94-2026.10.08.zip", "source_url": "", "source_note": "本机 Hermes 技能目录", "reference_urls": [], "notes": "本地技能目录重打包，不是官方发行包。仅包含技能文件，不包含运行时、插件服务、账号授权或第三方依赖；未进行完整安全审计和跨环境安装实测。公开分发前请核实授权与内容。", "updated_at": "2026.10.08", "package_size": 54414, "sha256": "50df86b82ab70a7dd0adc8859daf326a405853c02f8cf7c0eff2ed231bf5f75a", "package_root": "logistics-bill-audit-67cf94", "scene": "核快递账单 · 列问题", "icon": "🚚", "original": true, "id": "skill-228"}, {"id": "skill-229", "name": "pdd-duizhang-tongji", "description": "从拼多多对账中心的月汇总 / 经 来时用。", "full_description": "读取别人用链接分享给你的飞书 wiki／文档／多维表格（Base），含权限处理与内容提取。同事发来飞书链接、要把里面内容读出来时用。\n读的是通过链接分享的飞书 wiki／文档／Base 多维表格；含权限处理与内容提取。要比对口径、或要看对方表里内容时用。", "version": "1.0.0", "category": "办公协同", "agent": "Hermes", "install_method": "ZIP 手动", "package_url": "packages/feishu-5ed0d7-2026.10.07.zip", "source_url": "", "source_note": "本机 Hermes 技能目录", "reference_urls": [], "notes": "本地技能目录重打包，不是官方发行包。仅包含技能文件，不包含运行时、插件服务、账号授权或第三方依赖；未进行完整安全审计和跨环境安装实测。公开分发前请核实授权与内容。", "updated_at": "2026-10-07", "package_size": 19088, "sha256": "94d939e5aae35f97b39d60e1ab540c1e1f406f54c4dc36fff634b982d88e11b4", "package_root": "feishu-5ed0d7", "scene": "读飞书文档 · 开链接", "icon": "📘", "original": false, "exclusive": null}, {"name": "feishu-api", "description": "飞书 OpenAPI 建表、加字段、批量写记录、读全量。两个坑：分页用 GET /records（search 死循环）、公式列读出是 None。", "full_description": "通过飞书 OpenAPI 创建和修改多维表格：建表、加字段（文本/数字/单选/日期/公式/关联）、批量写记录、读全量数据、管理视图。两个必知的坑：分页取数必须用 GET /records（records/search 的 page_token 会重复返回同一页，脚本会无限拉第一页却不报错）；公式列（DSR、评价总数等）API 读出来是 None —— 飞书不返回公式计算结果。另有：国内接口须绕开系统代理（脚本内显式装 ProxyHandler({})）。要程序化建表、批量写数据进飞书、或排查飞书表读写异常时用。", "version": "1.0.0", "category": "办公协同", "agent": "Hermes", "install_method": "ZIP 手动", "package_url": "packages/feishu-api-85a5b0-2026.10.08.zip", "source_url": "", "source_note": "本机 Hermes 技能目录", "reference_urls": [], "notes": "本地技能目录重打包，不是官方发行包。仅包含技能文件，不包含运行时、插件服务、账号授权或第三方依赖；未进行完整安全审计和跨环境安装实测。公开分发前请核实授权与内容。", "updated_at": "2026.10.08", "package_size": 69897, "sha256": "8c29293d07f832305a4a1d956187736d97ecf05d6bd3c0249b3e4b67170c8b0c", "package_root": "feishu-api-85a5b0", "scene": "调飞书API · 改多维表", "icon": "📘", "id": "skill-289"}, {"name": "gh-pages-dashboard-maintenance", "description": "用 Excel 数据重建 HTML 看板并发到 GitHub Pages：只换数据对象，密码/校验/样式/JS 不动，推完回读核实。只改生成的 HTML 无效。", "full_description": "用 Excel 源数据重建静态 HTML 看板并发布到 GitHub Pages：只替换 HTML 里的数据对象（QDATA / 内嵌 JS 费率数组），保持密码、校验逻辑、CSS、筛选排序 JS 一律不动；推送后必须回读线上页面、断言新值在旧值没了，才算完成。覆盖三类看板 —— 主体财务看板（仓库内 /finance/）、快递决策看板（独立仓库算法版 + /logistics/ 速查表版，两份别混）、运营日报周报月报（/daily/、/weekly/、/monthly/，与飞书「运营数据登记」同一个 Base）。源表更新后要重新生成并上线看板、要改看板上的费率/调价数据、或要更新看板右上角的版本日期时用。⚠️ 三个反复踩的点：改内嵌数据必须「块内替换」不能全局 replace（同一个数字在多个对象里都出现，全局替换会改坏不报错）；看板带版本/日期的地方通常有 4 处（title、右上角 chip、header 说明、页脚版本号），只改一处会被退回；只改生成出来的 HTML 等于白改，改动必须落回生成器脚本。", "version": "未声明", "category": "数据分析", "agent": "Hermes", "install_method": "ZIP 手动", "package_url": "packages/gh-pages-dashboard-maintenance-7e8c91-2026.10.09.zip", "source_url": "", "source_note": "本机 Hermes 技能目录", "reference_urls": [], "notes": "本地技能目录重打包，不是官方发行包。仅包含技能文件，不包含运行时、插件服务、账号授权或第三方依赖；未进行完整安全审计和跨环境安装实测。公开分发前请核实授权与内容。", "updated_at": "2026.10.09", "package_size": 134158, "sha256": "f6017c63dd7c427dbabfa78a1865da3b4030e4579d494702c28af87baa639711", "package_root": "gh-pages-dashboard-maintenance-7e8c91", "scene": "重建看板 · 发Pages", "icon": "📝", "id": "skill-290"}, {"id": "skill-291", "name": "google-workspace", "description": "操作 Gmail、日历、Drive、Docs、Sheets。需要在 Google 那套服务之间处理邮件和文档时用。", "full_description": "操作 Gmail、日历、Drive、Docs、Sheets。需要在 Google 那套服务之间处理邮件和文档时用。", "version": "1.2.0", "category": "办公协同", "agent": "Hermes", "install_method": "ZIP 手动", "package_url": "packages/google-workspace-a1f88e-2026.10.07.zip", "source_url": "", "source_note": "本机 Hermes 技能目录", "reference_urls": [], "notes": "本地技能目录重打包，不是官方发行包。仅包含技能文件，不包含运行时、插件服务、账号授权或第三方依赖；未进行完整安全审计和跨环境安装实测。公开分发前请核实授权与内容。", "updated_at": "2026-10-07", "package_size": 26113, "sha256": "7055f0fb1a7f9f1dce72e24041b6b80769f1451a3dbdf3a23aadcb0dcdf83bdd", "package_root": "google-workspace-a1f88e", "scene": "管谷歌套件 · 邮件日历", "icon": "📝", "original": false, "exclusive": null}, {"id": "skill-292", "name": "hermes-desktop-session-recovery", "description": "聊天会话丢失、被隐藏或反复消失时做恢复。某个窗口的对话记录找不到了、需要安全找回时用。", "full_description": "聊天会话丢失、被隐藏或反复消失时做恢复。某个窗口的对话记录找不到了、需要安全找回时用。", "version": "1.1.0", "category": "平台服务", "agent": "Hermes", "install_method": "ZIP 手动", "package_url": "packages/hermes-desktop-session-recovery-5e401d-2026.10.07.zip", "source_url": "",
