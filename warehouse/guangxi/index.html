const unbase64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const CACHE_KEY='gx_billing_unlocked_v1';
function reveal(html){document.open('text/html','replace');document.write(html);document.close();}
try{const cached=sessionStorage.getItem(CACHE_KEY);if(cached){reveal(cached);}}catch(e){}
if(document.getElementById('login')){
document.getElementById('login').addEventListener('submit',async event=>{
  event.preventDefault();
  const button=document.getElementById('enter'),input=document.getElementById('password'),error=document.getElementById('error');
  button.disabled=true;button.textContent='正在解锁…';error.textContent='';
  if(!globalThis.crypto?.subtle){error.textContent='浏览器不支持安全解锁，请使用最新版 Chrome 或 Edge 访问 HTTPS 页面。';button.disabled=false;button.textContent='解锁看板';return}
  try{
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unbase64(ENVELOPE[0]),iterations:120000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const decoded=await crypto.subtle.decrypt({name:'AES-GCM',iv:unbase64(ENVELOPE[1])},key,unbase64(ENVELOPE[2]));
    input.value='';
    const content=new TextDecoder().decode(decoded);
    try{sessionStorage.setItem(CACHE_KEY,content);}catch(e){}
    reveal(content);
  }catch(e){
    error.textContent='密码错误，请重试。';input.value='';input.focus();
    button.disabled=false;button.textContent='解锁看板';
  }
});
}
